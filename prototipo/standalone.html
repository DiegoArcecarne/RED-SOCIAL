<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="planes" />
  <title>Prototipo (standalone) · App de planes</title>
  <meta name="description" content="Prototipo visual navegable de la app de planes (basado en PRODUCTO.md)." />
  <style>
/* =========================================================================
   Prototipo — App de planes. Modo oscuro tipo Instagram, minimalista.
   ========================================================================= */
:root{
  --bg:#000000;
  --surface:#0e0e10;
  --surface-2:#161618;
  --surface-3:#212124;
  --line:#262628;
  --ink:#f2f2f4;
  --ink-soft:#a6a6ad;
  --ink-dim:#6c6c73;
  --accent:#3d6fb3;        /* azul sobrio, único acento */
  --live:#c2444c;          /* semántico: "en directo" */
  --like:#d0606a;          /* semántico: me gusta */
  --radius:14px;
  --maxw:430px;
  --tb:calc(62px + env(safe-area-inset-bottom,0px));   /* alto de la barra inferior (con la zona segura del iPhone) */
  --tbo:var(--tb);         /* lo que ocupa la barra inferior ahora (0 cuando se esconde al bajar) */
  font-family:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:var(--ink);display:flex;justify-content:center;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

.phone{
  position:relative;width:100%;max-width:var(--maxw);min-height:100vh;min-height:100dvh;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;border-left:1px solid var(--line);border-right:1px solid var(--line);
}
@media(min-width:480px){ .phone{margin:24px 0;min-height:calc(100vh - 48px);border-radius:28px;border:1px solid var(--line)} }

/* Iconos */
.ico{display:inline-flex;width:1em;height:1em;line-height:0;vertical-align:-2px}
.ico svg{width:1em;height:1em;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico svg.fill,.ico svg .fill{fill:currentColor;stroke:none}

/* Cabecera */
.appbar{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);padding:16px 18px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;padding-bottom:12px}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-.5px}
.brand .tag{font-size:11px;color:var(--ink-dim);letter-spacing:.3px}
.brand .spacer{flex:1}

/* Pestañas de contenido por iconos */
.content-tabs{display:flex;justify-content:space-around;gap:6px}
.content-tabs button{
  background:none;border:none;cursor:pointer;font-family:inherit;color:var(--ink-dim);
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px 10px;flex:1;position:relative;
}
.content-tabs button .ico{font-size:21px}
.content-tabs button span{font-size:10px;font-weight:600}
.content-tabs button.active{color:var(--ink)}
.content-tabs button.active::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}

/* Scroll */
.view{flex:1;overflow-y:auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.view.hidden{display:none}
#view-feed,#view-mapa,#view-perfil{padding-left:0;padding-right:0}

/* Filtros por iconos */
.filters{display:flex;flex-direction:column;gap:12px;padding:14px 12px 12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button,.iseg button{
  flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;font-family:inherit;
  color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 11px;transition:.15s;min-width:58px;
}
.chips button .ico,.iseg button .ico{font-size:18px}
.chips button span,.iseg button span{font-size:10px;font-weight:600;white-space:nowrap}
.chips button.active,.iseg button.active{background:var(--ink);color:#000;border-color:var(--ink)}
.seg-row{display:flex;gap:8px}
.iseg{display:flex;gap:5px;flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:4px}
.iseg button{flex:1;border:none;background:none;min-width:0;border-radius:9px;padding:7px 4px}
.iseg button.active{background:var(--surface-3);color:var(--ink);border:none}

/* ===================== GRID tipo Instagram ===================== */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.cell{position:relative;aspect-ratio:1/1;border:none;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:0;color:#fff;text-align:left;font-family:inherit}
.cell-scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78) 4%,rgba(0,0,0,.1) 46%,rgba(0,0,0,.16) 100%)}
.cell-corner{position:absolute;top:7px;right:7px;z-index:2;font-size:13px;color:rgba(255,255,255,.82);background:rgba(0,0,0,.42);backdrop-filter:blur(3px);width:24px;height:24px;border-radius:7px;display:grid;place-items:center}
.cell-info{position:relative;z-index:2;padding:9px 9px 10px}
.cell-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;font-weight:700;line-height:1.22;letter-spacing:-.2px}
.cell-meta{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:10.5px;color:rgba(255,255,255,.72);font-weight:500}
.cell-meta .ico{font-size:12px}

/* Placeholder de pestañas */
.empty-tab{text-align:center;color:var(--ink-soft);padding:70px 30px}
.empty-tab .empty-ic{font-size:34px;color:var(--ink-dim);display:inline-flex;margin-bottom:14px}
.empty-tab h3{color:var(--ink);font-size:17px;margin-bottom:8px;font-weight:700}
.empty-tab p{font-size:13.5px;line-height:1.55}

/* ===================== MAPA ===================== */
.map-wrap{position:relative}
.map{position:relative;height:60vh;min-height:360px;overflow:hidden;
  background:repeating-linear-gradient(0deg,#0b0b0d 0 39px,#101013 39px 40px),repeating-linear-gradient(90deg,#0b0b0d 0 39px,#101013 39px 40px),#0b0b0d}
.map::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 45%,rgba(120,130,150,.10) 45% 51%,transparent 51%)}
.map::after{content:"";position:absolute;width:150px;height:120px;right:7%;bottom:9%;background:rgba(120,150,130,.10);border-radius:42% 50% 46% 54%}
.map-hint{position:absolute;top:12px;left:12px;right:12px;z-index:4;background:rgba(20,20,22,.9);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:7px}
.pin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;z-index:3;display:flex;flex-direction:column;align-items:center;background:none;border:none}
.pin-dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:16px;background:var(--surface-3);border:1.5px solid rgba(255,255,255,.22);box-shadow:0 4px 12px rgba(0,0,0,.5)}
.pin.public .pin-dot{background:#37526e;border-color:rgba(255,255,255,.32)}
.pin.business .pin-dot{background:#3a5f55;border-color:rgba(255,255,255,.32)}
.pin.secret .pin-dot{background:#2a2a2e;border-color:rgba(255,255,255,.28)}
.pin.selected .pin-dot{outline:3px solid rgba(255,255,255,.22);transform:scale(1.06)}
.pin-cap{margin-top:5px;font-size:10.5px;font-weight:600;background:rgba(20,20,22,.92);color:var(--ink);padding:2px 7px;border-radius:7px;white-space:nowrap;border:1px solid var(--line)}
.map-legend{position:absolute;bottom:12px;left:12px;z-index:4;display:flex;flex-direction:column;gap:5px}
.map-legend .lg{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:var(--ink);background:rgba(20,20,22,.9);padding:4px 9px;border-radius:8px;border:1px solid var(--line)}
.lgd{width:10px;height:10px;border-radius:50%}
.lgd.business{background:#3a5f55}.lgd.public{background:#37526e}.lgd.secret{background:#3a3a3e}
.map-sheet{padding:16px 16px 0}
.map-sheet h3{font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:7px;font-weight:700}
.map-sheet .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vchk{color:var(--ink);display:inline-flex;font-size:14px}
.mini-plan{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:9px;margin-bottom:9px;cursor:pointer;width:100%;text-align:left;font-family:inherit;color:var(--ink)}
.mini-thumb{width:46px;height:46px;border-radius:10px;flex:none}
.mini-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mini-t{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-m{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:4px}
.mini-corner{font-size:15px;color:var(--ink-soft);display:inline-flex}

/* ===================== DETALLE ===================== */
#view-detail{padding-bottom:0}
.detail-hero{height:240px;position:relative;display:flex;align-items:flex-end;padding:18px}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.15) 60%,rgba(0,0,0,.35))}
.hero-content{position:relative;z-index:2}
.back-btn{position:absolute;top:14px;left:14px;z-index:3;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.15);color:#fff;cursor:pointer;display:grid;place-items:center;font-size:16px}
.detail-hero h2{font-size:24px;font-weight:700;letter-spacing:-.6px;line-height:1.18;color:#fff;margin-top:8px}
.hero-loc{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:rgba(255,255,255,.82)}
.tags-row{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
.tag-line{background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(3px)}
.detail-body{padding:18px 16px 0}
.kpis{display:flex;gap:9px;margin-bottom:14px}
.kpi{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 8px;text-align:center}
.kpi .v{font-size:16px;font-weight:800;letter-spacing:-.3px}
.kpi .k{font-size:11px;color:var(--ink-soft);margin-top:4px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:12px}
.block h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-dim);margin-bottom:11px;font-weight:700}
.block p{font-size:14.5px;line-height:1.55;color:var(--ink)}
.block p.hint{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5}
.host-card{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:16px;font-weight:700;color:var(--ink);background:var(--surface-3);border:1px solid var(--line)}
.avatar.sm{width:34px;height:34px;font-size:12px;border:2px solid var(--bg);margin-left:-10px}
.avatar.sm:first-child{margin-left:0}
.avatar.lg{width:74px;height:74px;font-size:25px}
.host-card .meta{flex:1}
.host-card .meta .n{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px}
.host-card .meta .s{font-size:12.5px;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:6px}
.biz{font-size:11px;font-weight:700;background:var(--surface-3);color:var(--ink-soft);padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
.trust-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.trust{font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-soft);padding:7px 11px;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.trust .ico{color:var(--ink)}
.attendees{display:flex;align-items:center;flex-wrap:wrap;row-gap:6px}
.attendees .more{font-size:12.5px;color:var(--ink-soft);margin-left:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.rate{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.rate .ico{color:#c9b25f}
.review{padding:11px 0;border-bottom:1px solid var(--line)}
.review:last-child{border-bottom:none}
.review .top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px}
.review .top .st{color:#c9b25f;display:inline-flex;gap:1px;font-size:12px}
.review p{font-size:13.5px;color:var(--ink-soft);line-height:1.45}
.secret-note{display:flex;gap:11px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.secret-note .sn-ic{font-size:18px;color:var(--ink);margin-top:1px}
.secret-note p{font-size:13px;line-height:1.5;color:var(--ink-soft)}
.place-link{display:flex;align-items:center;gap:12px;cursor:pointer;width:100%;background:none;border:none;font-family:inherit;color:var(--ink);text-align:left;padding:0}
.place-link .pl-info{flex:1;min-width:0}
.pl-n{display:block;font-weight:700;font-size:14.5px}
.pl-s{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.pl-arrow{color:var(--ink-dim);font-size:18px;display:inline-flex}

/* Toggle de presencia / privacidad */
.toggle-row{display:flex;align-items:center;gap:12px;cursor:pointer}
.tg-ic{font-size:20px;color:var(--ink);display:inline-flex}
.tg-info{flex:1;min-width:0}
.tg-n{display:block;font-size:14px;font-weight:700}
.tg-s{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px}
.switch{flex:none;width:42px;height:25px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line);position:relative;transition:.18s}
.switch .knob{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--ink-soft);transition:.18s}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on .knob{left:19px;background:#fff}

.action-bar{position:sticky;bottom:var(--tbo);transition:bottom .22s ease;background:rgba(0,0,0,.9);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:13px 16px;display:flex;align-items:center;gap:14px;margin:14px -16px 0}
.action-bar .pr .v{font-size:19px;font-weight:800}
.action-bar .pr .k{font-size:11px;color:var(--ink-soft);margin-top:1px}
.btn-join{flex:1;border:none;border-radius:13px;padding:15px;font-size:15px;font-weight:800;color:#fff;cursor:pointer;font-family:inherit;background:var(--accent);display:flex;align-items:center;justify-content:center;gap:7px}
.btn-join.done{background:var(--surface-3);color:var(--ink-soft);cursor:default}

/* ===================== PERFIL ===================== */
.profile-head{display:flex;align-items:center;gap:16px;padding:14px 16px 8px}
.ph-main{flex:1;min-width:0}
.ph-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ph-name{font-size:16px;font-weight:700;display:inline-flex;align-items:center;gap:5px;min-width:0}
.pro-ic{display:inline-flex;color:var(--ink-soft);font-size:14px;flex:none}
.ph-handle{font-size:13px;color:var(--ink-soft);font-weight:500}
.ph-priv{font-size:12px;font-weight:700;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.ph-stats{display:flex;gap:18px;margin-top:12px;font-size:13px;color:var(--ink-soft)}
.ph-stats b{color:var(--ink)}
.prof-set{margin:8px 16px 4px}
.prof-tab{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);padding:14px 16px 12px;border-top:1px solid var(--line)}
.priv-banner{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:0 16px 12px}

/* Navegación inferior */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:var(--tb);padding-bottom:env(safe-area-inset-bottom,0px);z-index:30;background:rgba(0,0,0,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around}
.tabbar button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-dim);font-size:11px;font-weight:600;cursor:pointer;flex:1;font-family:inherit}
.tabbar button .ico{font-size:23px}
.tabbar button.active{color:var(--ink)}

/* Portadas (oscuras, sobrias) */
.g-wine{background:linear-gradient(150deg,#352230,#150f13)}
.g-sunset{background:linear-gradient(150deg,#33291f,#15110d)}
.g-grape{background:linear-gradient(150deg,#28223a,#13111c)}
.g-dark{background:linear-gradient(150deg,#26262c,#0e0e10)}
.g-forest{background:linear-gradient(150deg,#1d302c,#0e1916)}

/* Toast */
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%) translateY(16px);background:var(--surface-3);border:1px solid var(--line);color:var(--ink);padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:95;white-space:nowrap;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ======================= NUEVAS VISTAS (creación, grupos, perfil+, ajustes) ======================= */

/* Barra inferior con botón Crear centrado */
.tabbar button.create{flex:0 0 auto;color:#fff}
.create-fab{width:46px;height:46px;border-radius:14px;background:var(--accent);display:grid;place-items:center;color:#fff;box-shadow:0 4px 14px rgba(61,111,179,.45)}
.create-fab .ico{font-size:24px}

/* Barra de página (pantallas apiladas) */
.page-bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.pb-title{font-size:16px;font-weight:700}
.pb-back{width:34px;height:34px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:15px}
.pb-action{background:none;border:none;color:var(--accent);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-family:inherit}
.page-body{padding:14px 16px}

/* Formularios */
.form .field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field textarea,.field select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;color:var(--ink);font-family:inherit;font-size:14.5px;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{resize:vertical}
.field select option{background:#16161a;color:var(--ink)}
.field .hint{font-size:12px;color:var(--ink-soft);margin-top:7px;line-height:1.45}
.form-actions{margin:18px 0 10px}
.btn-primary{width:100%;border:none;border-radius:13px;padding:15px;font-size:15px;font-weight:800;color:#fff;background:var(--accent);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-ghost{margin-top:12px;width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px}

.cover-pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:46px;height:46px;border-radius:11px;border:2px solid transparent;cursor:pointer;padding:0}
.sw.active{border-color:var(--ink)}
.add-media{font-size:12.5px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);padding:11px 13px;border-radius:11px}
.add-media.center{justify-content:center;width:100%;margin-top:10px}
.mini-map{display:flex;align-items:center;gap:8px;justify-content:center;height:78px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--ink-soft);font-size:13px;margin-bottom:8px}

/* Chooser de creación */
.choose{display:flex;align-items:center;gap:14px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left}
.ch-ic{width:42px;height:42px;border-radius:11px;background:var(--surface-3);display:grid;place-items:center;font-size:20px;flex:none}
.ch-tx{flex:1}.ch-t{display:block;font-size:15px;font-weight:700}.ch-s{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px}

/* Vista previa de publicación */
.post-prev{height:230px;border-radius:14px;overflow:hidden;position:relative}
.post-prev .pp{display:block;width:100%;height:100%;border-radius:14px;position:relative}
.post-prev.carrusel{display:flex;gap:6px}
.post-prev.carrusel .pp{flex:none;width:78%;height:100%}
.play-ov{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;color:#fff}
.pp-dots{position:absolute;top:10px;right:12px;font-size:11px;font-weight:700;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:999px;color:#fff}

/* Grupos */
.page-bar .pb-title{flex:1}
.group-card{display:flex;align-items:center;gap:13px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:11px;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left}
.group-cover{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:22px;flex:none}
.gc-info{flex:1;min-width:0}.gc-n{display:block;font-weight:700;font-size:15px}.gc-m{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px}
.role{font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);padding:4px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.role.admin{color:var(--ink)}
.group-hero{height:120px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:34px;margin-bottom:12px}
.member{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;border-bottom:1px solid var(--line);padding:11px 0;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left}
.member:last-of-type{border-bottom:none}
.mem-n{flex:1;font-size:14px;font-weight:600}
.pick-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.pick-n{flex:1;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
.role-seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.role-seg button{border:none;background:none;color:var(--ink-soft);font-size:11px;font-weight:700;padding:5px 8px;border-radius:7px;cursor:pointer;font-family:inherit}
.role-seg button.active{background:var(--surface-3);color:var(--ink)}

/* Solicitudes */
.req{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.req:last-child{border-bottom:none}
.req-info{flex:1;min-width:0}.req-n{font-size:14px;font-weight:700}.req-m{font-size:12.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4}
.req-actions{display:flex;gap:8px;flex:none}
.ico-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;display:grid;place-items:center;font-size:17px}
.ico-btn.ok{color:#5bbf8a;border-color:#2f5e4c}
.ico-btn.no{color:#d9756b;border-color:#5e3733}
.req-state{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;flex:none}
.req-state.aceptada{color:#5bbf8a;background:rgba(91,191,138,.12)}
.req-state.rechazada{color:#d9756b;background:rgba(217,117,107,.12)}

/* Cuenta profesional */
.pro-badge{font-size:11px;font-weight:700;color:var(--ink);background:var(--surface-3);border:1px solid var(--line);padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
.pro-badge.sm{font-size:10px;padding:2px 7px}

/* Perfil ampliado */
.host-card.linkable{width:100%;background:none;border:none;padding:0;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left;display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bio{font-size:13.5px;color:var(--ink);line-height:1.45;padding:0 16px 10px;display:flex;flex-direction:column;gap:2px}
.ph-cat{color:var(--ink-soft);font-size:12.5px}
.ph-biz{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.ph-biz span,.ph-web{display:inline-flex;align-items:center;gap:4px}
.ph-biz .ico{font-size:13px}
.ph-web{background:none;border:none;padding:0;font:inherit;color:var(--ink);cursor:pointer;font-weight:600}
.prof-tabs{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:6px}
.prof-tabs button{flex:1;background:none;border:none;color:var(--ink-dim);padding:12px;font-family:inherit;font-weight:700;font-size:11.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-transform:uppercase;letter-spacing:.4px}
.prof-tabs button.active{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-of-type{border-bottom:none}.kv span{color:var(--ink-soft)}

/* Ajustes */
.set-group{margin-bottom:18px}
.set-title{font-size:12px;font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.5px;margin:0 2px 8px}
.set-row{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:8px;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left;font-size:14px}
.set-row.static{cursor:default}
.sr-ic{font-size:19px;color:var(--ink);display:inline-flex}
.sr-l{flex:1;font-weight:600}
.soon{font-size:11px;color:var(--ink-dim);background:var(--surface-2);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
.set-row.danger{color:#d9756b;justify-content:center}
.set-row.danger .sr-ic{color:#d9756b}
.toggle-row.set{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}

/* ======================= Nueva publicación: opciones avanzadas ======================= */
.cap-preview{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:13.5px;line-height:1.5;color:var(--ink);min-height:20px}
.cap-preview .ph{color:var(--ink-dim)}
.mention,.hash{color:var(--accent);font-weight:700}
.adv-title{font-size:12px;font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.5px;margin:18px 2px 8px}
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer}
.or-ic{font-size:19px;color:var(--ink);display:inline-flex;flex:none}
.or-l{flex:1;min-width:0;font-size:14px;font-weight:600;display:flex;flex-direction:column;gap:2px}
.or-s{font-size:11.5px;color:var(--ink-soft);font-weight:500;text-transform:none;letter-spacing:0}
.or-sel{flex:none;max-width:50%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-family:inherit;font-size:12.5px;padding:7px 8px;outline:none}
.opt-row .switch{flex:none}
.tag-chips{display:flex;flex-wrap:wrap;gap:7px}
.tag-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);border-radius:999px;padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.tag-chip.active{background:var(--ink);color:#000;border-color:var(--ink)}
.tag-chip .ico{font-size:14px}

/* ======================= Imágenes reales de portada (con fallback al degradado) ======================= */
.cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:0}
.mini-thumb{position:relative;overflow:hidden}
.post-prev .pp{overflow:hidden}
.post-prev .play-ov{z-index:2}
.post-prev .pp-dots{z-index:2}
/* el degradado del contenedor queda detrás como fallback si la imagen no carga (onerror la elimina) */

/* ======================= MURO (Vividas) ======================= */
[hidden]{display:none!important}
.wall{display:flex;flex-direction:column}
.post{border-bottom:1px solid var(--line);padding-bottom:14px}
.post-h{display:flex;align-items:center;gap:10px;padding:10px 14px}
.post-av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink);background:var(--surface-3);border:1.5px solid var(--line);cursor:pointer;font-family:inherit;padding:0}
.post-av.sm{width:28px;height:28px;font-size:10.5px}
.post-who{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.post-name{background:none;border:none;color:var(--ink);font:inherit;font-size:13.5px;font-weight:700;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:5px;text-align:left;flex-wrap:wrap}
.post-sub{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-kind{color:var(--ink-soft);font-size:17px;display:inline-flex}
.pm{position:relative;aspect-ratio:4/5;max-width:100%;overflow:hidden}
.pm-car .car-track{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.car-track::-webkit-scrollbar{display:none}
.car-slide{position:relative;flex:0 0 100%;scroll-snap-align:start}
.pm-count{position:absolute;top:10px;right:10px;z-index:2;font-size:11.5px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;padding:3px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.car-dots{position:absolute;bottom:10px;left:0;right:0;z-index:2;display:flex;justify-content:center;gap:5px;pointer-events:none}
.car-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}
.car-dots i.on{background:#fff}
.pm-video{cursor:pointer}
.kb{position:absolute;inset:0;overflow:hidden}
.pm-video.playing .kb .cover-img{animation:kenburns 9s ease-in-out infinite alternate}
.pm-play{position:absolute;inset:0;z-index:2;display:grid;place-items:center;font-size:48px;color:#fff;filter:drop-shadow(0 2px 8px rgba(0,0,0,.55));transition:opacity .2s}
.pm-video.playing .pm-play{opacity:0}
.pm-dur,.pm-mute{position:absolute;z-index:2;bottom:12px;font-size:11.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;font-variant-numeric:tabular-nums}
.pm-dur{left:12px}
.pm-mute{right:12px;font-size:14px;padding:5px}
.pm-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.18);z-index:2}
.pm-bar i{display:block;height:100%;width:0;background:#fff}
.pm-video.playing .pm-bar i{animation-name:vbar;animation-timing-function:linear;animation-iteration-count:infinite}
.burst{position:absolute;inset:0;z-index:3;display:grid;place-items:center;font-size:84px;color:#fff;opacity:0;pointer-events:none;filter:drop-shadow(0 4px 16px rgba(0,0,0,.4))}
.post.burst-on .burst{animation:burst .85s ease-out}
@keyframes vbar{from{width:0}to{width:100%}}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.12) translate(-2%,-2%)}}
@keyframes burst{0%{opacity:0;transform:scale(.4)}25%{opacity:.95;transform:scale(1.1)}70%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.post-actions{display:flex;align-items:center;gap:4px;padding:8px 10px 2px}
.pa{background:none;border:none;color:var(--ink);font-size:23px;padding:6px;cursor:pointer;display:inline-flex;border-radius:9px}
.pa:focus-visible,.post-plan:focus-visible,.ss:focus-visible,.st-tile:focus-visible,.live-card:focus-visible,.inject:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pa.liked{color:var(--like)}
.pa-sp{flex:1}
.post-body{padding:2px 14px 0;display:flex;flex-direction:column;gap:7px}
.post-likes{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.post-cap{font-size:13.5px;line-height:1.45;color:var(--ink)}
.post-plan{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;max-width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.post-plan span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.post-more{align-self:flex-start;background:none;border:none;color:var(--ink-soft);font:inherit;font-size:13px;padding:0;cursor:pointer}
.post-off{font-size:12.5px;color:var(--ink-dim)}

/* Plan inyectado en el muro */
.inject{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:230px;margin:14px;border-radius:16px;overflow:hidden;border:1px solid var(--line);cursor:pointer;text-align:left;font:inherit;color:#fff;padding:0}
.inject-scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,.15) 70%)}
.inject-tag{position:absolute;top:12px;left:12px;z-index:2;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:rgba(0,0,0,.55);padding:5px 10px;border-radius:999px}
.inject-info{position:relative;z-index:2;padding:14px;display:flex;flex-direction:column;gap:7px}
.inject-t{font-size:17px;font-weight:700;letter-spacing:-.3px;text-wrap:balance}
.inject-m{font-size:12px;color:rgba(255,255,255,.85);display:flex;flex-wrap:wrap;gap:4px 10px}
.inject-m span{display:inline-flex;align-items:center;gap:4px}
.inject-cta{align-self:flex-start;margin-top:2px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;padding:8px 12px;border-radius:10px;display:inline-flex;gap:4px;align-items:center}

/* Tira "Ahora mismo" dentro del muro */
.strip{padding:12px 0 14px;border-bottom:1px solid var(--line)}
.strip-h{display:flex;align-items:center;gap:7px;padding:0 14px 10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft)}
.strip-all{margin-left:auto;background:none;border:none;color:var(--accent);font:inherit;font-size:12.5px;font-weight:700;text-transform:none;letter-spacing:0;cursor:pointer}
.strip-row{display:flex;gap:10px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
.strip-row::-webkit-scrollbar{display:none}
.ss{flex:none;width:92px;display:flex;flex-direction:column;gap:6px;background:none;border:none;color:var(--ink);font:inherit;cursor:pointer;padding:0;text-align:left;border-radius:12px}
.ss-img{position:relative;display:block;width:92px;height:140px;border-radius:12px;overflow:hidden;background:var(--surface-3);border:2px solid var(--line)}
.ss.live .ss-img{border-color:var(--live)}
.ss-badge{position:absolute;top:6px;left:6px;z-index:2;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;background:var(--live);color:#fff;padding:2px 6px;border-radius:5px}
.ss-n{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ======================= Pestaña Stories ======================= */
.stories-tab{padding:14px 0 8px}
.sec-h{display:flex;align-items:center;gap:7px;padding:4px 14px 10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft)}
.sec-s{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink-dim)}
.live-row{display:grid;grid-auto-flow:column;grid-auto-columns:80%;gap:10px;overflow-x:auto;padding:0 14px 18px;scrollbar-width:none;scroll-snap-type:x mandatory}
.live-row::-webkit-scrollbar{display:none}
.live-card{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:14px;overflow:hidden;border:none;padding:0;cursor:pointer;color:#fff;text-align:left;font:inherit;scroll-snap-align:start;background:var(--surface-3)}
.lc-scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.08) 60%)}
.live-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;background:var(--live);color:#fff;padding:4px 8px;border-radius:6px;flex:none}
.live-card .live-badge{position:absolute;top:10px;left:10px;z-index:2}
.lc-view{position:absolute;top:10px;right:10px;z-index:2;font-size:11.5px;font-weight:700;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:6px;display:inline-flex;gap:5px;align-items:center;font-variant-numeric:tabular-nums}
.lc-info{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;display:flex;flex-direction:column;gap:3px}
.lc-t{font-size:15px;font-weight:700}
.lc-m{font-size:12px;color:rgba(255,255,255,.82)}
.st-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 14px}
.st-tile{position:relative;aspect-ratio:9/14;max-width:100%;border-radius:14px;overflow:hidden;border:none;padding:0;cursor:pointer;color:#fff;text-align:left;font:inherit;background:var(--surface-2)}
.st-scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,0) 55%,rgba(0,0,0,.35))}
.st-ring{position:absolute;top:10px;left:10px;z-index:2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-3);color:var(--ink);border:2px solid #fff}
.st-count{position:absolute;top:13px;right:10px;z-index:2;font-size:11px;font-weight:700;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:999px}
.st-info{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;display:flex;flex-direction:column;gap:2px;min-width:0}
.st-n{font-size:13px;font-weight:700}
.st-m{font-size:11px;color:rgba(255,255,255,.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1.5px dashed var(--line);color:var(--ink);background:var(--surface)}
.st-plus{width:46px;height:46px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:22px;color:#fff}

/* ======================= Capa superpuesta ======================= */
.overlay{position:absolute;inset:0;z-index:60;background:#000;color:#fff;overflow:hidden}
.ov-sheet{background:transparent}
.sv-media{position:absolute;inset:0}
.sv-media.kb-on .cover-img{animation:kenburns 14s ease-in-out infinite alternate}
.sv-shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.6),rgba(0,0,0,0) 24%,rgba(0,0,0,0) 55%,rgba(0,0,0,.8))}
.sv-bars{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;z-index:4;display:flex;gap:4px}
.sv-bar{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.sv-bar i{display:block;height:100%;background:#fff}
.sv-head{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:5;display:flex;align-items:center;gap:9px}
.ov-live .sv-head{top:calc(14px + env(safe-area-inset-top,0px))}
.sv-who{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13px}
.sv-who span{font-size:11.5px;color:rgba(255,255,255,.78);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-x{background:rgba(0,0,0,.4);border:none;color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;cursor:pointer;flex:none}
.sv-tap{position:absolute;top:80px;bottom:120px;z-index:3;background:none;border:none;cursor:pointer}
.sv-tap.prev{left:0;width:35%}
.sv-tap.next{right:0;width:65%}
.sv-text{position:absolute;left:18px;right:18px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:4;font-size:22px;font-weight:700;line-height:1.25;letter-spacing:-.3px;text-shadow:0 2px 14px rgba(0,0,0,.6);text-wrap:balance;pointer-events:none}
.sv-cta{position:absolute;left:16px;right:16px;bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:5;background:#fff;color:#000;border:none;border-radius:12px;padding:13px;font:inherit;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}
.lv-view{font-size:11.5px;font-weight:700;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:6px;display:inline-flex;gap:5px;align-items:center;flex:none;font-variant-numeric:tabular-nums}
.lv-host{position:absolute;top:calc(62px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:4;font-size:12px;background:rgba(0,0,0,.55);border-radius:10px;padding:8px 10px;display:flex;gap:7px;align-items:center}
.lv-chat{position:absolute;left:12px;right:72px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;flex-direction:column;gap:6px;font-size:13px}
.lv-chat p{background:rgba(0,0,0,.42);border-radius:10px;padding:6px 10px;align-self:flex-start;max-width:100%}
.lv-hearts{position:absolute;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:60px;height:240px;z-index:4;pointer-events:none}
.lv-hearts .ico{position:absolute;bottom:0;font-size:26px;color:var(--like);animation:floatup 1.6s ease-out forwards}
@keyframes floatup{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-220px) scale(1.1);opacity:0}}
.lv-bar{position:absolute;left:10px;right:10px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:4px}
.lv-input{flex:1;min-width:0;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35);border-radius:999px;color:#fff;padding:10px 14px;font:inherit;font-size:13.5px;outline:none}
.lv-input:focus{border-color:#fff}
.ov-live .pa{color:#fff}
.ov-live .lv-like{color:var(--like)}
.lv-cta{flex:none;background:#fff;color:#000;border:none;border-radius:999px;padding:10px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.lv-cta.end{background:var(--live);color:#fff}

/* Hoja de comentarios */
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:72%;display:flex;flex-direction:column;background:var(--surface);border-top-left-radius:18px;border-top-right-radius:18px;border-top:1px solid var(--line);color:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.sheet-list{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:90px}
.cm{display:flex;gap:10px;align-items:flex-start}
.cm p{font-size:13.5px;line-height:1.45;min-width:0}
.sheet-in{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.sheet-in input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;color:var(--ink);padding:10px 14px;font:inherit;font-size:13.5px;outline:none}
.sheet-in input:focus{border-color:var(--accent)}

/* Publicación suelta (desde un perfil) */
.ov-post{background:var(--bg);overflow-y:auto}
.ov-post .post-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(0,0,0,.88);border-bottom:1px solid var(--line)}
.ov-post .post-top span{flex:1;font-weight:700;font-size:15px}

/* Contador de caracteres y editar perfil */
.field label .cnt{float:right;font-weight:600;letter-spacing:0;color:var(--ink-dim);font-variant-numeric:tabular-nums;text-transform:none}
.field label .cnt.near{color:var(--ink)}
.field .hint.err{color:var(--like)}
.ph-actions{display:flex;gap:8px;padding:0 16px 12px}
.ph-btn{flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.ep-photo{display:flex;flex-direction:column;align-items:center;gap:8px;margin:4px 0 18px}
.at-input{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding-left:13px}
.at-input:focus-within{border-color:var(--accent)}
.at-input span{color:var(--ink-soft);font-size:14.5px}
.field .at-input input{border:none;background:none;padding-left:2px}

/* Pestañas del perfil: icono; el nombre solo en la activa */
.prof-tabs button .ico{font-size:17px}
.prof-tabs button .pt-l{display:none}
.prof-tabs button.active .pt-l{display:inline}
.follows-you{display:inline-block;margin-top:3px;font-size:11px;font-weight:600;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.ph-priv.primary{background:var(--accent);border-color:var(--accent);color:#fff}

/* Valoraciones */
.ratings{display:flex;flex-direction:column;gap:10px;padding:12px}
.r-prefs{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink-soft);font:inherit;font-size:12.5px;text-align:left;cursor:pointer}
.r-prefs span{flex:1;line-height:1.4}
.r-prefs b{color:var(--ink)}
.r-prefs .ico{font-size:16px;flex:none}
.rating{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.rating.pending{border-style:dashed}
.r-thumb{position:relative;flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;border:none;padding:0;cursor:pointer}
.r-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.r-title{background:none;border:none;padding:0;color:var(--ink);font:inherit;font-size:14px;font-weight:700;text-align:left;cursor:pointer}
.r-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-soft)}
.r-stars{display:inline-flex;gap:1px}
.r-stars i{display:inline-flex;width:13px;height:13px;color:var(--surface-3)}
.r-stars i.on{color:#c9b25f}
.r-stars svg{width:100%;height:100%;fill:currentColor;stroke:none}
.r-text{font-size:13px;line-height:1.45;color:var(--ink)}
.vis-chip{display:inline-flex;align-items:center;gap:5px;margin-top:2px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-soft);border-radius:999px;padding:4px 10px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer}
.vis-chip .ico{font-size:13px}
.vis-chip.solid{background:var(--ink);color:#000;border-color:var(--ink)}
.vc-gen{color:var(--ink-dim);font-weight:500}
.rate-pick{display:flex;justify-content:center;gap:8px;padding:4px 0 14px}
.rate-pick button{width:40px;height:40px;background:none;border:none;padding:0;cursor:pointer;color:var(--surface-3)}
.rate-pick button.on{color:#c9b25f}
.rate-pick svg{width:100%;height:100%;fill:currentColor;stroke:none}
.set-box{display:flex;flex-direction:column;gap:8px;padding:12px 14px}
.sb-l{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-top:4px}
.set-box .hint{font-size:12px;color:var(--ink-soft);line-height:1.45;margin-top:4px}
.set-box .iseg button{flex-direction:row;justify-content:center;gap:5px}
.set-box .iseg button span{font-size:12px}
.set-box .iseg button .ico{font-size:15px}

/* Compartir */
.sheet.sh{max-height:86%}
.sh .sheet-list{gap:10px}
.sh .sheet-list > *{flex:none}
.sh .hint{font-size:12px;color:var(--ink-soft);line-height:1.45}
.sh-sec{font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin-top:4px}
.sh-people{display:flex;gap:14px;padding-top:3px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.sh-person{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;color:var(--ink);font:inherit;font-size:11.5px;cursor:pointer;width:58px}
.sh-person .avatar{position:relative;width:52px;height:52px}
.sh-person.on .avatar{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.sh-ok{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;border:2px solid var(--surface)}
.sh-msg{padding:0;border:none}
.btn-primary.sm{width:auto;flex:none;padding:10px 16px;font-size:13.5px}
.sh-row{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
.sh-row span{flex:1}
.og-card{display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.og-img{position:relative;display:block;aspect-ratio:1.91/1;overflow:hidden}
.og-txt{display:flex;flex-direction:column;gap:2px;padding:9px 11px 11px;font-size:12.5px;color:var(--ink-soft);line-height:1.35}
.og-txt b{color:var(--ink);font-size:13.5px}
.og-sum{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.back-btn.share-btn{left:auto;right:14px}
.og-d{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-dim)}
.sh-apps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sh-app{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;color:var(--ink);font:inherit;font-size:11px;text-decoration:none;cursor:pointer;padding:4px 0}
.sh-ic{width:46px;height:46px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:19px}
.sh-lock{display:flex;gap:8px;align-items:flex-start}

/* Mensajes */
.dm-btn{position:relative;align-self:center;background:none;border:none;color:var(--ink);font-size:22px;padding:2px;cursor:pointer;display:inline-flex}
.dm-badge{position:absolute;top:-4px;right:-7px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--live);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;font-style:normal;border:2px solid #000}
.ph-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.inbox{display:flex;flex-direction:column;gap:10px}
.inbox .mp-search{margin:0}
.tab-dot{width:6px;height:6px;border-radius:50%;background:var(--live);display:inline-block}
.link-btn{background:none;border:none;padding:0;color:var(--ink);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.conv{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;color:var(--ink);font:inherit;text-align:left;padding:8px 0;cursor:pointer}
.conv-av{flex:none;width:50px;height:50px;font-size:15px}
.conv-av.plan{position:relative;border-radius:14px;overflow:hidden;display:block}
.conv-av.sm2{width:36px;height:36px;font-size:12px}
.conv-av.plan.sm2{border-radius:10px}
.conv-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.conv-main b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-main span{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv.unread .conv-main span{color:var(--ink);font-weight:600}
.conv-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11px;color:var(--ink-dim)}
.conv-dot{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;font-style:normal;display:grid;place-items:center}
.chat-bar{justify-content:flex-start}
.chat-who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.chat-who .cw-t{min-width:0;display:flex;flex-direction:column}
.chat-who b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-who .cw-t > span{font-size:11.5px;color:var(--ink-soft)}
.chat-pin{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 12px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--ink-soft)}
.chat-pin > span{flex:1;min-width:60%}
.chat-pin b{color:var(--ink)}
.chat-body{display:flex;flex-direction:column;gap:6px;padding:12px 12px 70px}
.chat-sep{align-self:center;font-size:11px;color:var(--ink-dim);margin:4px 0 6px}
.msg{display:flex;flex-direction:column;align-items:flex-start;gap:4px;max-width:78%}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg-who{font-size:11px;color:var(--ink-soft);margin:6px 0 0 10px}
.bubble{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:18px;font-size:14px;line-height:1.4;word-break:break-word}
.msg.me .bubble{background:var(--accent);border-color:var(--accent);color:#fff}
.msg-card{display:flex;flex-direction:column;width:220px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.mc-img{position:relative;display:block;aspect-ratio:4/3;overflow:hidden}
.mc-txt{display:flex;flex-direction:column;gap:2px;padding:8px 10px;font-size:12px;color:var(--ink-soft)}
.mc-txt b{color:var(--ink);font-size:13px}
.msg-img{position:relative;display:block;width:200px;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--surface-2)}
.msg-img.blur .cover-img{filter:blur(18px);transform:scale(1.15)}
.msg-reveal{position:absolute;inset:auto 8px 8px 8px;background:rgba(0,0,0,.6);border:none;color:#fff;border-radius:10px;padding:7px 8px;font:inherit;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer}
.chat-foot{position:sticky;bottom:var(--tbo);background:rgba(0,0,0,.9);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 12px}
.view#view-page:not(.hidden):has(.chat-foot){padding-bottom:0;display:flex;flex-direction:column}
.chat-body{flex:1 0 auto}
.chat-in{display:flex;align-items:center;gap:8px}
.chat-in input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;color:var(--ink);padding:11px 15px;font:inherit;font-size:14px;outline:none}
.chat-in input:focus{border-color:var(--accent)}
.chat-note{margin:0 0 8px;font-size:12px;color:var(--ink-soft)}
.chat-req p{font-size:12.5px;color:var(--ink-soft);line-height:1.45;margin-bottom:8px}
.chat-req p b{color:var(--ink)}
.chat-req-b{display:flex;gap:8px}
.sh-row.danger{color:var(--live)}

/* Solicitudes y reportes */
.inbox > .hint{font-size:12.5px;color:var(--ink-soft);line-height:1.45}
.conv-wrap{display:flex;align-items:center;gap:8px}
.conv-wrap .conv{flex:1;min-width:0}
.req-q{display:flex;gap:6px;flex:none}
.req-all{align-self:flex-end;font-size:12.5px}
.chat-req-l{display:flex;justify-content:center;gap:22px;margin-top:10px}
.chat-req-l .link-btn{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:13px}
.link-btn.danger{color:var(--live)}
.rep{gap:10px}
.rep-list{display:flex;flex-direction:column;gap:6px}
.rep-opt{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);font:inherit;font-size:13.5px;text-align:left;cursor:pointer}
.rep-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-dim);flex:none}
.rep-opt.on{border-color:var(--ink)}
.rep-opt.on .rep-dot{border-color:var(--accent);background:radial-gradient(var(--accent) 45%, transparent 50%)}
.rep-danger{display:flex;gap:10px;background:rgba(194,68,76,.12);border:1px solid rgba(194,68,76,.5);border-radius:12px;padding:12px;font-size:13px;line-height:1.45}
.rep-danger > .ico{color:var(--live);font-size:18px;flex:none;margin-top:1px}
.rep-danger p{color:var(--ink-soft);margin:4px 0 10px}
.rep-call{display:inline-flex;text-decoration:none;justify-content:center}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}

/* Verificación y perfiles */
.ph-actions .hint{flex:1;font-size:12.5px;color:var(--ink-soft);line-height:1.4;display:flex;gap:6px;align-items:center}
.sheet-list > .hint{font-size:12px;color:var(--ink-soft);line-height:1.45}
.vg{align-items:center;text-align:center;gap:12px;padding:22px 18px 18px}
.vg-ic{width:56px;height:56px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:26px}
.vg h3{font-size:17px;line-height:1.3}
.vg > p{font-size:13.5px;color:var(--ink-soft);line-height:1.5}
.vg-list{list-style:none;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;margin:4px 0}
.vg-list li{display:flex;gap:10px;font-size:13px;line-height:1.45;color:var(--ink)}
.vg-list li > .ico{font-size:17px;flex:none;margin-top:1px;color:var(--ink-soft)}
.vg .btn-ghost{width:100%}
.vg-inline{display:flex;gap:8px;align-items:flex-start;margin-top:8px;background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--ink-soft);font:inherit;font-size:12.5px;line-height:1.45;text-align:left;cursor:pointer;width:100%}
.vg-inline .ico{font-size:15px;flex:none;margin-top:1px;color:var(--ink)}
.vg-note{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:16px;font-size:13px;line-height:1.45;color:var(--ink-soft)}
.vg-note .ico{font-size:17px;flex:none;color:var(--ink)}
.vg-note b{color:var(--ink)}
.ph-switch{background:none;border:none;padding:0;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:3px;color:var(--ink-soft)}
.ph-switch .ico{font-size:12px;transform:rotate(90deg)}
.vg-chip{display:inline-flex;align-items:center;gap:5px;margin-top:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:3px 9px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}

/* Filtro por origen: planes o vida */
.wall-filter{padding:10px 12px 4px}
.prof-filter{padding:10px 12px 8px}
.origin-seg button{flex-direction:row;justify-content:center;gap:6px;padding:8px 4px}
.origin-seg button .ico{font-size:16px}
.origin-seg button span{font-size:12px}
.origin-seg em{font-style:normal;font-size:11px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.cm-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.or-sel.wide{max-width:none;width:100%;margin-top:8px;padding:10px}

/* Música */
.post-music{background:none;border:none;color:var(--ink);font:inherit;font-size:11.5px;padding:1px 0 0;display:flex;align-items:center;gap:5px;cursor:pointer;min-width:0;max-width:100%;text-align:left}
.post-music .ico{font-size:13px;flex:none}
.pmu-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{display:none;align-items:flex-end;gap:2px;height:11px;flex:none}
.eq i{display:block;width:2.5px;height:100%;background:currentColor;border-radius:1px;transform-origin:bottom;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}
.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.post-music.on .ico,.sv-music.on .ico{display:none}
.post-music.on .eq,.sv-music.on .eq{display:inline-flex}
button.pm-mute{border:none;cursor:pointer;font:inherit}
.pm-mute .ico + .ico,.sv-sound .ico + .ico{display:none}
.pm-mute.on .ico:first-child,.sv-sound.on .ico:first-child{display:none}
.pm-mute.on .ico + .ico,.sv-sound.on .ico + .ico{display:inline-flex}
