.pay-opt{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);font:inherit;font-size:14px;cursor:pointer;text-align:left}
.pay-opt > span:last-child{display:flex;flex-direction:column}
.pay-opt.on{border-color:var(--accent)}
.pay-opt.on .rep-dot{border-color:var(--accent);background:radial-gradient(var(--accent) 45%, transparent 50%)}
.pay-err{display:flex;gap:7px;align-items:center;font-size:13px;color:#f0b9bd}
.pay-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-top:8px}
.pay-line span{flex:1}
.pay-line .link-btn{font-size:13px}
.pay-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.pay-kpis div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px}
.pay-kpis b{font-size:17px}
.pay-kpis span{font-size:11.5px;color:var(--ink-soft);line-height:1.3}
.pay-card{margin-bottom:10px}
.st-pay-retenido,.st-pay-pendiente,.st-pay-en_revision{border-color:var(--accent)}
.st-pay-pagado,.st-pay-liberado{color:var(--ink)}
.sub-l{display:block;margin-top:12px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.rcpt{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;line-height:1.5;color:var(--ink-soft)}
.rcpt-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px;color:var(--ink)}
.rcpt-h b{font-size:18px}
.rcpt table{width:100%;border-collapse:collapse;margin:6px 0 8px}
.rcpt th,.rcpt td{text-align:left;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
.rcpt th{font-weight:500;color:var(--ink-dim);width:42%}
.rcpt td{color:var(--ink)}
.set-group > .hint{font-size:12.5px;color:var(--ink-soft);line-height:1.45;margin:6px 2px 0}

/* ======================= Interfaz compacta ======================= */
/* Filtros plegados: buscador + botón "Filtros"; los puestos, como chips debajo. */
.filters{gap:8px;padding:10px 12px 8px}
.filter-bar{display:flex;gap:8px;align-items:stretch}
.filter-bar .search-entry{flex:1;min-width:0}
.filter-bar .search-entry span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter-btn{position:relative;flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.filter-btn .ico{font-size:18px}
.filter-btn.on,.filter-btn.open{border-color:var(--ink)}
.filter-btn em{font-style:normal;min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:#000;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.filter-active{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filter-active:empty{display:none}
.filter-active::-webkit-scrollbar{display:none}
.f-chip{flex:none;display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 9px 5px 11px;color:var(--ink);font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.f-chip .ico{font-size:12px;color:var(--ink-soft)}
.filter-panel{display:flex;flex-direction:column;gap:10px;animation:fpanel .18s ease}
.filter-panel[hidden]{display:none}
.filter-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.filter-foot .ph-btn{flex:0 0 auto;padding:8px 18px}
@keyframes fpanel{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* Cabecera y barra inferior que se esconden al bajar y vuelven al subir. */
.appbar{transition:margin-top .22s ease}
.tabbar{transition:transform .22s ease}
.phone.chrome-hidden{--tbo:0px}
.phone.chrome-hidden .appbar{position:relative;margin-top:calc(-1 * var(--ah, 140px))}
.phone.chrome-hidden .tabbar{transform:translateY(100%)}
@media (prefers-reduced-motion: reduce){ .appbar,.tabbar,.action-bar{transition:none} .filter-panel{animation:none} }
.filter-foot .link-btn{font-size:13px}

/* ======================= Aquí ahora: chinchetas y saludos ======================= */
.ping-ic{position:relative;display:inline-grid;place-items:center;width:30px;height:30px;flex:none;color:var(--accent);font-size:17px}
.ping-ic.sm{width:22px;height:22px;font-size:14px}
.ping-ic > .ico{position:relative;z-index:1;animation:ping-bob 1.6s ease-in-out infinite}
.ping-ring{position:absolute;left:50%;bottom:2px;width:60%;height:24%;margin-left:-30%;border-radius:50%;border:1.5px solid var(--accent);opacity:0;animation:ping-ring 1.6s ease-out infinite}
.ping-ring.r2{animation-delay:.8s}
@keyframes ping-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes ping-ring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.ping-msg{display:inline-flex;align-items:center;gap:8px}
.here-map{position:relative;height:190px;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin:4px 0 8px;
  background:radial-gradient(circle at 50% 52%, rgba(61,111,179,.22), transparent 42%),repeating-linear-gradient(0deg, transparent 0 23px, rgba(255,255,255,.03) 23px 24px),repeating-linear-gradient(90deg, transparent 0 23px, rgba(255,255,255,.03) 23px 24px),var(--surface-2)}
.here-venue{position:absolute;left:10px;top:9px;display:inline-flex;gap:5px;align-items:center;font-size:11.5px;font-weight:700;color:var(--ink-soft);background:rgba(0,0,0,.45);border-radius:999px;padding:3px 9px}
.here-pin{position:absolute;transform:translate(-50%,-50%);background:none;border:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.here-pin .avatar.sm{width:32px;height:32px;font-size:11px;border:2px solid var(--surface);box-shadow:0 3px 10px rgba(0,0,0,.5)}
.here-pin.me{z-index:2}
.here-pin.me .ping-ic{width:34px;height:34px;font-size:22px}
.here-me{font-size:10.5px;font-weight:800;color:var(--ink);background:var(--accent);border-radius:999px;padding:1px 7px}
.here-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.here-row .conv-main{flex:1;min-width:0}
.ping-btn{flex:none;display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 2px;color:var(--ink);font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.ping-btn.done{color:var(--ink-dim);cursor:default}
.ping-btn.done .ping-ring,.ping-btn.done .ico{animation:none}
.pin-here{position:absolute;top:-16px;left:-22px;display:flex;align-items:center;background:var(--surface);border:1px solid var(--accent);border-radius:999px;padding:0 6px 0 0;z-index:2}
.pin-here em{font-style:normal;font-size:10.5px;font-weight:800;color:var(--ink)}
.pin.live .pin-dot{outline:2px solid var(--accent);outline-offset:2px}
.here-strip{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--accent);border-radius:12px;padding:8px 10px;margin:8px 0 10px}
.here-t{flex:1;min-width:0;display:flex;flex-direction:column;font-size:12.5px;line-height:1.35}
.here-t span{color:var(--ink-soft)}
.here-avs{display:flex}
.here-avs .avatar.sm{width:26px;height:26px;font-size:9.5px;margin-left:-6px;border:2px solid var(--surface-2);cursor:pointer}
.block .sb-l{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:6px 0 6px}
@media (prefers-reduced-motion: reduce){ .ping-ic > .ico,.ping-ring{animation:none} .ping-ring{opacity:0} }

.msg.me .ping-ic{color:#fff}
.msg.me .ping-ring{border-color:#fff}
.here-row .conv-main b,.here-row .conv-main span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.here-msg{flex:none;width:34px;height:34px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:50%;color:var(--ink);font-size:16px;cursor:pointer}

/* ======================= Chispas: posibles planes ======================= */
.ideas{padding:2px 0 12px}
.ideas-h{display:flex;justify-content:space-between;align-items:center;padding:0 12px 8px;font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px}
.ideas-h > span{display:inline-flex;align-items:center;gap:6px}
.ideas-h .link-btn{font-size:12.5px;text-transform:none;letter-spacing:0;text-decoration:none;color:var(--accent)}
.ideas-row{display:flex;gap:8px;overflow-x:auto;padding:0 12px;scroll-snap-type:x mandatory;scrollbar-width:none}
.ideas-row::-webkit-scrollbar{display:none}
.idea-card{flex:0 0 200px;scroll-snap-align:start;display:flex;flex-direction:column;gap:5px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;color:var(--ink);font:inherit;cursor:pointer}
.ideas-list .idea-card{flex:none;width:100%;margin-bottom:8px}
.idea-who{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-soft)}
.idea-who .avatar.sm{width:22px;height:22px;font-size:9px}
.idea-who.big{font-size:14px;gap:10px;margin-bottom:6px}
.idea-who.big .avatar{width:40px;height:40px;font-size:14px;cursor:pointer}
.idea-t{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.idea-m{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-soft)}
.idea-q{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--accent);margin-top:2px}
.idea-new{border-style:dashed;justify-content:center;align-items:flex-start}
.idea-new > .ico{font-size:20px;color:var(--ink-soft)}
.idea-title{font-size:22px;line-height:1.25;margin:2px 0 6px}
.idea-text{font-size:15px;line-height:1.5;color:var(--ink);margin-bottom:10px}
.idea-page .trust-row{margin-bottom:14px}
.idea-acts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.idea-acts .btn-primary,.idea-acts .btn-ghost{margin-top:0}
.idea-btns{display:flex;gap:8px}
.idea-btns .btn-join{flex:1}
.idea-btns .ph-btn{flex:0 0 96px}
.idea-acts .link-btn{align-self:flex-start;font-size:13px}
.ideas-list{margin-top:12px}
.page-body.form > p.hint:first-child{font-size:13px;line-height:1.45;margin-bottom:14px;color:var(--ink-soft)}
.idea-page > .hint{font-size:12.5px;line-height:1.45;color:var(--ink-soft)}
.opt-row.off{opacity:.55}

/* ---------- herramientas internas (admin.js) ---------- */
.cell-feat{position:absolute;top:7px;left:7px;z-index:2;font-size:10.5px;font-weight:700;letter-spacing:.2px;color:#fff;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);border-radius:7px;padding:4px 7px}
.adm-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.adm-tabs::-webkit-scrollbar{display:none}
.adm-tabs button{flex:none;display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--ink-soft);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.adm-tabs button .ico{font-size:15px}
.adm-tabs button.active{color:var(--ink);border-color:var(--accent);background:var(--surface-3)}
.adm-tabs em{font-style:normal;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;background:var(--accent);color:#fff}
.adm-filt button{padding:5px 11px;font-size:12.5px}
.adm-sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px}
.adm-sec .hint{font-size:12px;line-height:1.45;color:var(--ink-dim);margin-top:8px}
.adm-sim{float:right;text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink-dim)}
.adm-hero{display:flex;flex-direction:column;gap:2px;margin:2px 2px 10px}
.adm-hero span{font-size:12.5px;color:var(--ink-soft)}
.adm-hero b{font-size:52px;line-height:1.05;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.adm-hero em{font-style:normal;font-size:12.5px;color:var(--ink-soft)}
.wk-chart{width:100%;height:auto;display:block}
.wk-col{fill:var(--accent)}
.wk-bar:hover .wk-col{fill:#5b88c6}
.wk-grid{stroke:var(--line);stroke-width:1}
.wk-axis{fill:var(--ink-dim);font-size:10px}
.wk-val{fill:var(--ink);font-size:11px;font-weight:700}
.adm-table{margin-top:6px;font-size:12.5px;color:var(--ink-soft)}
.adm-table summary{cursor:pointer;padding:4px 0}
.adm-table table{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
.adm-table th,.adm-table td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
.adm-table th:first-child,.adm-table td:first-child{text-align:left}
.adm-table th{color:var(--ink-dim);font-weight:600;font-size:11px}
.adm-table td{color:var(--ink)}
.adm-hyp{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.adm-hyp:first-of-type{border-top:none}
.adm-hyp b{font-size:13.5px}
.adm-hyp p{font-size:12.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4}
.adm-st{flex:none;width:112px;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px 9px 3px 6px}
.adm-st .ico{font-size:14px}
.adm-st.st-good .ico{color:#0ca30c}
.adm-st.st-good{border-color:rgba(12,163,12,.55)}
.adm-st.st-warn .ico{color:#fab219}
.adm-st.st-warn{border-color:rgba(250,178,25,.55)}
.adm-st.st-bad .ico{color:#d03b3b}
.adm-st.st-bad{border-color:rgba(208,59,59,.6)}
.st.st-bad{border-color:rgba(208,59,59,.6);color:var(--ink)}
.adm-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.adm-kpis > div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.adm-kpis span{font-size:11.5px;color:var(--ink-soft)}
.adm-kpis b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-kpis em{font-style:normal;font-size:11.5px;color:var(--ink-dim)}
.adm-row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;text-align:left;padding:9px 0;cursor:pointer}
.adm-row.static{cursor:default}
.adm-row .conv-av{width:42px;height:42px;font-size:13px}
.adm-row .mini-thumb{width:42px;height:42px}
.tag-av.sm{width:42px;height:42px;flex:none;font-size:18px}
.adm-facts{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.adm-acts{display:flex;flex-direction:column;gap:8px}
.adm-docs{display:flex;flex-wrap:wrap;gap:6px}
.adm-docs span{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-dim);border:1px dashed var(--line);border-radius:8px;padding:3px 7px}
.adm-docs span.ok{color:var(--ink);border-style:solid}
.adm-docs span .ico{font-size:12px}
.page-body.inbox > .mod-card{margin-bottom:0}

/* ---------- agenda (agenda.js) ---------- */
.pb-btns{display:flex;gap:6px}
.ag{display:flex;flex-direction:column;gap:12px}
.ag-seg{flex:none}
.ag-nav{display:flex;align-items:center;gap:8px}
.ag-nav b{flex:1;text-align:center;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-arrow{width:34px;height:34px;flex:none;border-radius:50%;background:none;border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:15px}
.ag-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink-dim);padding-top:4px}
.ag-legend span{display:flex;align-items:center;gap:5px}
.ag-legend i{width:14px;height:10px;border-radius:3px;display:block}
/* estilos por tipo: firme (relleno), a medias (borde discontinuo), pasado (apagado), cancelado (tachado) */
.k-firm{background:var(--accent);border:1px solid var(--accent)}
.k-pend{background:transparent;border:1px dashed var(--accent)}
.k-past{background:var(--surface-3);border:1px solid var(--line)}
.k-off{background:transparent;border:1px solid var(--line)}
.ag-row{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-left-width:3px;border-radius:10px;color:var(--ink);font:inherit;text-align:left;padding:8px 10px;cursor:pointer}
.ag-row.k-firm{border-left-color:var(--accent);background:var(--surface)}
.ag-row.k-pend{border-style:dashed;border-left-style:solid;border-left-color:var(--accent);background:transparent}
.ag-row.k-past{border-left-color:var(--ink-dim);background:transparent;color:var(--ink-soft)}
.ag-row.k-off{border-left-color:var(--line);background:transparent;color:var(--ink-dim)}
.ag-row.k-off b{text-decoration:line-through}
.ag-t{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;width:40px;flex:none}
.ag-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ag-main b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-main span{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-tag{flex:none;font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:2px 7px}
.ag-free{font-size:12.5px;color:var(--ink-dim);padding:6px 0}
.ag-empty{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
/* día */
.ag-day{position:relative;margin-top:4px}
.ag-hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);height:0}
.ag-hr span{position:absolute;left:0;top:-7px;font-size:10.5px;color:var(--ink-dim);background:var(--bg);padding-right:6px;font-variant-numeric:tabular-nums}
.ag-now{position:absolute;left:44px;right:0;border-top:2px solid var(--live);z-index:2}
.ag-now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--live)}
.ag-ev{position:absolute;z-index:1;display:flex;flex-direction:column;gap:1px;overflow:hidden;text-align:left;border-radius:8px;padding:5px 8px;font:inherit;color:#fff;cursor:pointer}
.ag-ev b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-ev span{font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-ev em{font-style:normal;font-size:10.5px;font-weight:700;opacity:.85}
.ag-ev.k-firm{background:#2c5592;border-color:var(--accent)}
.ag-ev.k-pend{background:var(--bg);color:var(--ink)}
.ag-ev.k-past{color:var(--ink-soft)}
.ag-ev.k-off{color:var(--ink-dim)}
.ag-ev.k-off b{text-decoration:line-through}
/* semana */
.ag-week{display:flex;flex-direction:column}
.ag-wd{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ag-wd-h{width:44px;flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:none;color:var(--ink);font:inherit;cursor:pointer;padding-top:4px}
.ag-wd-h b{font-size:18px;font-variant-numeric:tabular-nums;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.ag-wd-h span{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.4px}
.ag-wd.today .ag-wd-h b{background:var(--ink);color:var(--bg)}
.ag-wd-items{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
/* mes */
.ag-mh,.ag-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.ag-mh span{text-align:center;font-size:11px;color:var(--ink-dim);font-weight:700;padding-bottom:6px}
.ag-cell{aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding-top:6px;background:none;border:none;border-top:1px solid var(--line);color:var(--ink);font:inherit;font-size:13.5px;cursor:pointer}
.ag-cell > span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.ag-cell.out{color:var(--ink-dim)}
.ag-cell.today > span{background:var(--ink);color:var(--bg);font-weight:700}
.ag-cell.sel > span{box-shadow:0 0 0 1.5px var(--accent)}
.ag-dots{display:flex;gap:3px;height:6px}
.ag-dots i{width:6px;height:6px;border-radius:50%;display:block}
.ag-sel{display:flex;flex-direction:column;gap:8px}
.ag-sel .notif-h span{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)}
.ag-sel .notif-h span::first-letter{text-transform:uppercase}
/* año */
.ag-year{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.ag-mini{display:flex;flex-direction:column;gap:6px;background:none;border:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;padding:0}
.ag-mini-h{display:flex;justify-content:space-between;align-items:baseline}
.ag-mini-h b{font-size:13px;text-transform:capitalize}
.ag-mini-h em{font-style:normal;font-size:11px;color:var(--ink-soft);font-weight:700}
.ag-mini-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ag-mini-g i{font-style:normal;font-size:9.5px;color:var(--ink-dim);text-align:center;line-height:18px;border-radius:50%;font-variant-numeric:tabular-nums}
.ag-mini-g i.on{background:var(--accent);color:#fff;font-weight:700}
.ag-mini-g i.today{box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink)}
/* entrada desde notificaciones y exportar */
.ag-entry{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--ink);font:inherit;text-align:left;padding:11px 12px;cursor:pointer}
.ag-entry .notif-t b{display:block;font-size:14px;margin-bottom:1px;color:var(--ink)}
.ag-entry > .ico{color:var(--ink-dim);font-size:15px;flex:none}
.ag-feed{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;overflow-wrap:anywhere}
.ag-feed code{font-size:12px;color:var(--ink-soft)}

/* ---------- almacenamiento ---------- */
function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k){ try { localStorage.removeItem(k); } catch (e) {} }
// Hash de demostración (no criptográfico). En la app real: Argon2id en el servidor.
function demoHash(pass, salt){
  let h1 = 0xdeadbeef ^ 7, h2 = 0x41c6ce57 ^ 7; const s = salt + ':' + pass;
  for (let i = 0; i < s.length; i++){ const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16) + (h1 >>> 0).toString(16);
}
function accounts(){
  let list = [];
  try { list = JSON.parse(lsGet(ACCOUNTS_KEY) || '[]'); } catch (e) { list = []; }
  if (!Array.isArray(list)) list = [];
  if (!list.some(a => a.id === 'demo')){
    // Cuenta de demostración: Marina, con todo el contenido de ejemplo.
    list.unshift({ id:'demo', method:'email', email:DEMO_LOGIN.email, phone:'', salt:'demo', hash:demoHash(DEMO_LOGIN.pass, 'demo'),
      twoFA:null, birthdate:'1995-04-12', consents:{ legal:true, marketing:false, version:LEGAL_VERSION }, onboarded:true, createdAt:'2026-01-10' });
    lsSet(ACCOUNTS_KEY, JSON.stringify(list));
  }
  return list;
}
function saveAccounts(list){ lsSet(ACCOUNTS_KEY, JSON.stringify(list)); }
function getAccount(id){ return accounts().find(a => a.id === id) || null; }
function updateAccount(id, patch){ const list = accounts(); const a = list.find(x => x.id === id); if (a){ Object.assign(a, patch); saveAccounts(list); } return a; }

/* ---------- validaciones ---------- */
const isEmail = (s) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s);
// Teléfono: los españoles de 9 cifras se completan con +34; el resto, con prefijo internacional.
function normPhone(s){
  const t = String(s || '').replace(/[\s().-]/g, '');
  if (/^[6789]\d{8}$/.test(t)) return '+34' + t;
  if (/^\+\d{8,15}$/.test(t)) return t;
  if (/^00\d{8,15}$/.test(t)) return '+' + t.slice(2);
  return '';
}
function passwordIssue(p, id){
  if ((p || '').length < 8) return 'Mínimo 8 caracteres.';
  if (!/[A-Za-zÁÉÍÓÚáéíóúÑñ]/.test(p) || !/\d/.test(p)) return 'Combina letras y números.';
  if (id && p.toLowerCase().includes(String(id).split('@')[0].toLowerCase())) return 'No uses tu email o teléfono en la contraseña.';
  return '';
}
function ageFrom(birth){
  const b = new Date(birth); if (isNaN(b)) return -1;
  const n = new Date(); let a = n.getFullYear() - b.getFullYear();
  if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--;
  return a;
}
function findByIdentifier(idf){
  const v = String(idf || '').trim().toLowerCase(), ph = normPhone(v);
  return accounts().find(a => (a.email && a.email.toLowerCase() === v) || (ph && a.phone === ph)) || null;
}
function maskTo(to){ return to.includes('@') ? to.replace(/^(.).*(@.*)$/, '$1•••$2') : to.slice(0, 4) + ' ••• ' + to.slice(-3); }

/* ---------- códigos de un solo uso (simulados) ----------
   El "envío" se muestra como una notificación del sistema dentro del prototipo. */
function deliverCode(to, purpose, via){
  const code = String(Math.floor(100000 + Math.random() * 900000));
  state.otp = { code, purpose, to, via: via || (to.includes('@') ? 'email' : 'sms'), exp: Date.now() + OTP_TTL_MS, tries: 0, resendAt: Date.now() + OTP_RESEND_MS };
  const from = state.otp.via === 'app' ? 'Autenticador' : (state.otp.via === 'email' ? 'Correo · planes' : 'SMS · planes');
  showSimNotice(from, state.otp.via === 'app' ? `Código actual: ${code}` : `Tu código de planes es ${code}. Caduca en 10 minutos. No lo compartas con nadie.`, code);
  return code;
}
function showSimNotice(from, text, code){
  const n = document.getElementById('sim-note'); if (!n) return;
  n.innerHTML = `<button class="sim-in" onclick="fillCode('${code || ''}')"><span class="sim-app">${ico('chat')} ${escapeHtml(from)} · ahora</span><span>${escapeHtml(text)}</span>${code ? '<span class="sim-tap">Toca para rellenar</span>' : ''}</button>`;
  n.hidden = false; clearTimeout(n._t); n._t = setTimeout(() => { n.hidden = true; }, 12000);
}
function fillCode(code){ const i = document.getElementById('f-otp'); if (i && code){ i.value = code; } const n = document.getElementById('sim-note'); if (n) n.hidden = true; }
// Comprueba el código: caduca a los 10 min y admite 5 intentos.
function checkOtp(input){
  const o = state.otp;
  if (!o) return 'Pide un código nuevo.';
  if (Date.now() > o.exp) return 'El código ha caducado. Pide uno nuevo.';
  if (o.tries >= OTP_MAX_TRIES) return 'Demasiados intentos. Pide un código nuevo.';
  if (String(input || '').trim() !== o.code){ o.tries++; return `Código incorrecto. Te quedan ${OTP_MAX_TRIES - o.tries} intentos.`; }
  return '';
}
function resendCode(){
  const o = state.otp; if (!o) return;
  const wait = Math.ceil((o.resendAt - Date.now()) / 1000);
  if (wait > 0){ toast(`Puedes pedir otro código en ${wait} s`); return; }
  deliverCode(o.to, o.purpose, o.via); renderAuth();
}

function submitLogin(){
  const idf = val('f-id').trim(), pass = val('f-pass');
  state.auth.data.identifier = idf;
  const acc = findByIdentifier(idf);
  // Mismo mensaje exista o no la cuenta: no se desvela qué emails están registrados.
  const generic = 'Email, teléfono o contraseña incorrectos.';
  if (!acc) return authErr(generic);
  if (acc.lockedUntil && Date.now() < acc.lockedUntil) return authErr(`Demasiados intentos. Vuelve a probar en ${Math.ceil((acc.lockedUntil - Date.now()) / 60000)} min o recupera la contraseña.`);
  if (demoHash(pass, acc.salt) !== acc.hash){
    const failed = (acc.failed || 0) + 1;
    updateAccount(acc.id, failed >= LOGIN_MAX_FAILS ? { failed:0, lockedUntil: Date.now() + LOCK_MS } : { failed });
    return authErr(failed >= LOGIN_MAX_FAILS ? 'Demasiados intentos. Hemos bloqueado el acceso 15 minutos.' : generic);
  }
  updateAccount(acc.id, { failed:0, lockedUntil:null });
  if (acc.twoFA){
    state.auth.data.accountId = acc.id;
    const m = acc.twoFA.method, to = m === 'sms' ? acc.phone : (m === 'email' ? acc.email : 'app');
    deliverCode(to, 'login2fa', m === 'app' ? 'app' : m);
    return showAuth('codigo');
  }
  finishLogin(acc.id);
}

const DESTINO_KEY = 'planes-destino';
const SHARED_ROUTE = /^#\/(plan|p|u|tema)\/[\w.%-]+$/;
function rememberDestino(){ if (SHARED_ROUTE.test(location.hash || '')) lsSet(DESTINO_KEY, location.hash); }
function takeDestino(){ const d = lsGet(DESTINO_KEY); lsDel(DESTINO_KEY); return d && SHARED_ROUTE.test(d) ? d : null; }
function destinoLabel(){
  const d = lsGet(DESTINO_KEY); if (!d || !SHARED_ROUTE.test(d)) return '';
  const [, kind, id] = d.match(/^#\/(\w+)\/(.+)$/);
  if (kind === 'plan'){ const p = getPlan(id); return p ? 'el plan «' + p.title + '»' : 'un plan'; }
  if (kind === 'u'){ const u = getUser(id); return u ? 'el perfil de ' + u.name : 'un perfil'; }
  if (kind === 'p'){ const po = POSTS.find(x => x.id === id), u = po && getUser(po.authorId); return u ? 'una publicación de ' + u.name : 'una publicación'; }
  return 'el tema #' + decodeURIComponent(id);
}

/* =========================================================================
   Bucle central de planes (simulado en el navegador): filtro por fecha, foto real
   al crear, lista de espera, reconfirmación del día, cancelaciones con su política,
   llegada con el QR del anfitrión, índice de fiabilidad, edición y cancelación por el
   anfitrión, chat del plan y notificaciones.
   Lo que hará el servidor de verdad: docs/bucle-de-planes.md.
   ========================================================================= */
const RECONFIRM_HOURS = 24;            // la reconfirmación se pide en las 24 h previas
const RECONFIRM_DEADLINE_HOURS = 2;    // sin reconfirmar 2 h antes, la plaza pasa a la lista de espera
const LATE_CANCEL_HOURS = 24;          // cancelar con menos de 24 h es una cancelación tardía
const CHECKIN_BEFORE_MIN = 60, CHECKIN_AFTER_MIN = 240;
const CHECKIN_WINDOW_MS = 10 * 60 * 1000;   // el código de llegada cambia cada 10 minutos
const DEMO_CHECKIN_ANYTIME = true;     // en la demo se puede registrar la llegada a cualquier hora
// Las de PRODUCTO.md (Modelo económico). Las elige el anfitrión al publicar un plan de pago.
const CANCEL_POLICIES = {
  flexible: { label:'Flexible', text:'reembolso completo hasta 24 h antes; después, sin reembolso.' },
  moderada: { label:'Moderada', text:'reembolso completo hasta 48 h antes, el 50 % entre 48 y 24 h, y sin reembolso en las últimas 24 h.' },
  estricta: { label:'Estricta', text:'reembolso completo hasta 7 días antes; después, sin reembolso.' },
};
const QR_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';

const hoursTo = (p) => (p.when - Date.now()) / 3600000;
function fmtHour(d){ return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function dayWord(p){ const h = hoursTo(p); const d = new Date(p.when), n = new Date(); const t = new Date(n); t.setDate(n.getDate() + 1);
  if (d.toDateString() === n.toDateString()) return 'Hoy'; if (d.toDateString() === t.toDateString()) return 'Mañana'; return h < 0 ? 'Ya' : fmtWhen(d); }
function isHost(p){ return p.hostId === 'me'; }
function canRunPlan(p){ return isHost(p) || canManage(p); }   // anfitrión, o admin del grupo organizador
function isFull(p){ return p.joinType !== 'libre' && (p.joined || 0) >= p.groupMax; }
function waitPos(p){ return (p.waitlist || []).indexOf('me') + 1; }
function isCancelled(p){ return p.status === 'cancelado'; }

/* ---------- filtro por fecha en Descubrir ---------- */
const WHEN_OPTS = [['todo','Cuándo'],['hoy','Hoy'],['manana','Mañana'],['finde','Finde'],['semana','7 días']];
function matchesWhen(p, w){
  if (!w || w === 'todo') return true;
  const d = new Date(p.when), now = new Date();
  if (d < now) return false;
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(d) - day(now)) / 86400000);
  if (w === 'hoy') return diff === 0;
  if (w === 'manana') return diff === 1;
  if (w === 'semana') return diff <= 7;
  if (w === 'finde'){   // el próximo sábado y domingo (o este, si ya es fin de semana)
    const dow = now.getDay(), toSat = dow === 0 ? -1 : 6 - dow;
    return diff >= Math.max(0, toSat) && diff <= toSat + 1 && [0, 6].includes(d.getDay());
  }
  return true;
}

/* ---------- foto real al crear un plan ---------- */
// Reduce la foto (lado mayor 1200 px, JPEG) para que quepa en el navegador.
function resizeImage(file, max, quality){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = reject;
    r.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
function pickPlanPhoto(input){
  const f = input && input.files && input.files[0]; if (!f) return;
  if (!/^image\//.test(f.type)){ toast('Elige una imagen'); return; }

/* ---------- apuntarse, lista de espera y cancelar ---------- */
function joinPlan(id){
  const p = getPlan(id); if (!p || isCancelled(p)) return;
  if (!requireVerified('Verifica tu identidad para apuntarte', () => joinPlan(id))) return;
  const pay = p.paid && myPayment(id);
  if (isFull(p) && !(pay && pay.status === 'pendiente')) return joinWaitlist(id);
  if (p.paid && !(pay && pay.status === 'retenido')) return openCheckout(id);   // de pago: primero se paga (pagos.js)
  completeJoin(id, 'Apuntado · te esperamos');
}
function completeJoin(id, msg){
  const p = getPlan(id); if (!p) return;
  if (!state.joined.has(id)){ state.joined.add(id); p.joined = (p.joined || 0) + 1; }
  ensurePlanChat(id);
  remindJoined(p);
  saveState();
  toast(msg);
  renderDetail(id);
}
// Recordatorio al apuntarse: si es en las próximas 24 h, ya; si no, se programaría para el día antes.
function remindJoined(p){
  if (hoursTo(p) <= RECONFIRM_HOURS) notify('recordatorio', `${dayWord(p)} a las ${fmtHour(new Date(p.when))}: ${p.title}. Reconfirma que vas.`, { planId: p.id });
}
function joinWaitlist(id){
  const p = getPlan(id); if (!p) return;
  if (!requireVerified('Verifica tu identidad para apuntarte a la lista de espera', () => joinWaitlist(id))) return;
  if (!p.waitlist.includes('me')) p.waitlist.push('me');
  saveState();
  toast(`Estás en la lista de espera (puesto ${waitPos(p)}). Te avisamos si queda una plaza.`);
  renderDetail(id);
}
function leaveWaitlist(id){ const p = getPlan(id); if (!p) return; p.waitlist = p.waitlist.filter(x => x !== 'me'); saveState(); toast('Has salido de la lista de espera'); renderDetail(id); }
// Alguien libera una plaza: la recibe la primera persona de la lista.
function releaseSpot(id){
  const p = getPlan(id); if (!p) return;
  const next = p.waitlist.shift();
  if (!next){ return; }
  if (next === 'me' && p.paid){   // de pago: la plaza se guarda 24 h para que pagues
    const x = newPayment(p, 'me', 'pendiente'); x.dueAt = Date.now() + PAY_WINDOW_HOURS * 3600000;
    notify('plaza', `¡Hay plaza para ti en ${p.title}! Paga en las próximas ${PAY_WINDOW_HOURS} h para confirmarla.`, { planId: id });
  } else if (next === 'me'){
    state.joined.add(id); ensurePlanChat(id);
    notify('plaza', `¡Tienes plaza en ${p.title}! Ya estás apuntado.`, { planId: id });
  } else p.joined = (p.joined || 0) + 1;
}
// Demo: simula que alguien cancela, para ver avanzar la lista de espera.
function demoSomeoneCancels(id){
  const p = getPlan(id); if (!p) return;
  p.joined = Math.max(0, (p.joined || 0) - 1);
  releaseSpot(id); saveState(); renderDetail(id);
  if (!state.joined.has(id)) toast(`Alguien ha cancelado. Ahora eres el puesto ${waitPos(p)}`);
}
function refundFor(p){
  if (!p.paid) return null;
  const h = hoursTo(p), pol = p.cancelPolicy || 'flexible';
  const pct = pol === 'flexible' ? (h >= 24 ? 100 : 0) : pol === 'moderada' ? (h >= 48 ? 100 : (h >= 24 ? 50 : 0)) : (h >= 168 ? 100 : 0);
  return { pct, amount: Math.round(p.price * pct) / 100, policy: CANCEL_POLICIES[pol] };
}
function openCancel(id){
  const p = getPlan(id); if (!p) return;
  const late = hoursTo(p) < LATE_CANCEL_HOURS, rf = refundFor(p);
  showOverlay('ov-sheet', `<div class="sheet-bg" onclick="closeOverlay()"></div><div class="sheet" role="dialog" aria-label="Cancelar asistencia">
    <div class="sheet-h"><span>Cancelar asistencia</span><button class="sv-x" onclick="closeOverlay()" aria-label="Cerrar">${ico('close')}</button></div>
    <div class="sheet-list">
      <p class="hint"><b>${escapeHtml(p.title)}</b> · ${fmtWhen(new Date(p.when))}</p>
      ${rf && (myPayment(id) || {}).status === 'retenido' ? `<div class="vg-note">${ico('euro')}<p>Política ${rf.policy.label.toLowerCase()}: ${rf.policy.text}<br><b>${rf.pct ? `Si cancelas ahora te devolvemos ${money(rf.amount)} (${rf.pct} %).` : 'Si cancelas ahora no hay reembolso.'}</b></p></div>` : ''}
      ${late ? `<div class="vg-note">${ico('clock')}<p>Falta menos de un día: cuenta como <b>cancelación tardía</b> en tu fiabilidad. No es lo mismo que no presentarse, pero se ve.</p></div>`
        : `<p class="hint">Avisar con tiempo no afecta a tu fiabilidad.</p>`}
      ${p.waitlist.length ? `<p class="hint">Tu plaza pasará a la primera persona de la lista de espera.</p>` : ''}
      <button class="btn-primary danger-btn" onclick="confirmCancel('${id}')">Cancelar mi asistencia</button>
      <button class="btn-ghost" onclick="closeOverlay()">Mantener la plaza</button>
    </div></div>`);
}
function confirmCancel(id){
  const p = getPlan(id); if (!p || !state.joined.has(id)) { closeOverlay(); return; }
  const late = hoursTo(p) < LATE_CANCEL_HOURS, rf = refundFor(p);
  state.joined.delete(id); state.reconfirmed.delete(id);
  p.joined = Math.max(0, (p.joined || 0) - 1);
  if (late){ ME.stats = ME.stats || {}; ME.stats.lateCancels = (ME.stats.lateCancels || 0) + 1; }
  leavePlanChat(id);
  const paid = rf && refundMyPayment(p, rf);
  releaseSpot(id);
  saveState(); closeOverlay();
  toast('Asistencia cancelada' + (paid && rf.pct ? ` · te devolvemos ${money(rf.amount)}` : '') + (late ? ' · cancelación tardía' : ''));
  renderDetail(id);
}

/* ---------- reconfirmación del día ---------- */
function needsReconfirm(p){
  const h = hoursTo(p);
  return state.joined.has(p.id) && !state.attended.has(p.id) && !state.reconfirmed.has(p.id) && h <= RECONFIRM_HOURS && h > -1 && !isCancelled(p);
}
function reconfirm(id){
  state.reconfirmed.add(id); saveState();
  toast('Reconfirmado: el grupo sabe que vas'); renderDetail(id);
}

/* ---------- llegada con el QR del anfitrión ----------
   El código es el mismo en cualquier móvil (depende del plan y de la franja de 10 min),
   así que se puede probar con dos móviles sin servidor. En la app real lo firma el
   servidor con una clave secreta y comprueba también la hora y, si se quiere, la ubicación. */
function checkinCode(planId, t){
  const w = Math.floor((t || Date.now()) / CHECKIN_WINDOW_MS), s = `${planId}:${w}:planes-llegada`;
  let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return String((h >>> 0) % 10000).padStart(4, '0');
}
function validCheckinCode(planId, code){ const now = Date.now(); return [now, now - CHECKIN_WINDOW_MS].some(t => checkinCode(planId, t) === String(code || '').trim()); }
function checkinOpen(p){ if (DEMO_CHECKIN_ANYTIME) return true; const m = (Date.now() - p.when) / 60000; return m >= -CHECKIN_BEFORE_MIN && m <= CHECKIN_AFTER_MIN; }
function canScan(){ return typeof window !== 'undefined' && 'BarcodeDetector' in window && typeof navigator !== 'undefined' && navigator.mediaDevices && navigator.mediaDevices.getUserMedia; }
function openCheckin(id){
  const p = getPlan(id); if (!p) return;
  if (!requireVerified('Verifica tu identidad para registrar tu llegada', () => openCheckin(id))) return;
  if (!checkinOpen(p)){ toast('La llegada se registra desde 1 h antes hasta 4 h después del inicio'); return; }
  showOverlay('ov-sheet', `<div class="sheet-bg" onclick="closeOverlay()"></div><div class="sheet" role="dialog" aria-label="Registrar mi llegada">
    <div class="sheet-h"><span>Registrar mi llegada</span><button class="sv-x" onclick="closeOverlay()" aria-label="Cerrar">${ico('close')}</button></div>
    <div class="sheet-list ck">
      <p class="hint">Pide al anfitrión que te enseñe el QR de llegada del plan y escanéalo, o escribe el código de 4 cifras que aparece debajo.</p>
      <div id="scan-box" class="scan-box">${canScan() ? `<button class="btn-primary" onclick="startScan('${id}')">${ico('image')} Escanear QR</button>` : `<p class="hint">Este navegador no puede escanear: escribe el código.</p>`}</div>
      <div class="chat-in"><input id="ck-code" inputmode="numeric" maxlength="4" placeholder="Código del anfitrión" aria-label="Código de llegada" onkeydown="if(event.key==='Enter')submitCheckin('${id}')"><button class="ph-btn primary" onclick="submitCheckin('${id}')">Confirmar</button></div>
      <p class="hint ck-err" id="ck-err"></p>
      <button class="link-btn ck-demo" onclick="document.getElementById('ck-demo').hidden=false">¿Pruebas con un solo móvil? Ver el código del anfitrión</button>
      <p class="hint" id="ck-demo" hidden>Demo: el código ahora es <b>${checkinCode(id)}</b>. Con dos móviles, abre en el otro el plan como anfitrión y escanea su QR.</p>
      <p class="hint">${{ todos:'Te verán los demás que estén en el plan, en el plan y en el mapa.', amigos:'Solo te verán tus amigos que estén en el plan.', nadie:'Contarás en el total, sin que nadie vea que estás.' }[myPresence(id).vis]} Lo puedes cambiar en la ficha.</p>
    </div></div>`);
}
function submitCheckin(id){
  const code = val('ck-code');
  if (!validCheckinCode(id, code)){ const e = document.getElementById('ck-err'); if (e) e.textContent = 'Ese código no es el de este plan o ha caducado. Pídeselo de nuevo al anfitrión.'; toast('Código no válido'); return; }
  stopScan(); closeOverlay(); registerArrival(id);
}
function startScan(id){
  if (!canScan()) return;
  const box = document.getElementById('scan-box'); if (!box) return;
  box.innerHTML = `<video id="scan-v" class="scan-v" playsinline muted></video><p class="hint">Apunta al QR del anfitrión.</p>`;
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(stream => {
    state.scanStream = stream;
    const v = document.getElementById('scan-v'); if (!v){ stopScan(); return; }
    v.srcObject = stream; v.play();
    const det = new window.BarcodeDetector({ formats: ['qr_code'] });
    const loop = () => {
      if (!state.scanStream) return;
      det.detect(v).then(codes => {
        const m = codes.map(c => /^planes:llegada:([^:]+):(\d{4})$/.exec(c.rawValue)).find(Boolean);
        if (m && m[1] === id){ const i = document.getElementById('ck-code'); if (i) i.value = m[2]; submitCheckin(id); }
        else requestAnimationFrame(loop);
      }, () => requestAnimationFrame(loop));
    };
    loop();
  }, () => { box.innerHTML = '<p class="hint">Sin permiso para la cámara: escribe el código.</p>'; });
}
function stopScan(){ if (state.scanStream){ try { state.scanStream.getTracks().forEach(t => t.stop()); } catch (e) {} state.scanStream = null; } }
function loadQrLib(){
  return new Promise((resolve, reject) => {
    if (typeof window !== 'undefined' && window.QRCode) return resolve(window.QRCode);
    if (!document.createElement || !document.head) return reject(new Error('sin DOM'));
    const sc = document.createElement('script'); sc.src = QR_LIB; sc.async = true;
    sc.onload = () => window.QRCode ? resolve(window.QRCode) : reject(new Error('sin QRCode'));
    sc.onerror = reject; document.head.appendChild(sc);
  });
}
// Pantalla del anfitrión: QR de llegada que se renueva cada 10 minutos.
function openHostQr(id){
  const p = getPlan(id); if (!p) return;

    const code = checkinCode(id), box = document.getElementById('qr-box'), num = document.getElementById('qr-code');
    if (num) num.textContent = code;
    if (!box) return;
    loadQrLib().then(Q => { box.innerHTML = ''; new Q(box, { text: `planes:llegada:${id}:${code}`, width: 220, height: 220, colorDark: '#000000', colorLight: '#ffffff' }); },
      () => { box.innerHTML = `<p class="hint">Sin conexión para dibujar el QR: enseña el código.</p>`; });
  };
  showOverlay('ov-sheet', `<div class="sheet-bg" onclick="closeOverlay()"></div><div class="sheet" role="dialog" aria-label="QR de llegada">
    <div class="sheet-h"><span>QR de llegada</span><button class="sv-x" onclick="closeOverlay()" aria-label="Cerrar">${ico('close')}</button></div>
    <div class="sheet-list qr">

      <button class="btn-ghost" onclick="openManualArrivals('${id}')">${ico('users')} Marcar llegadas a mano</button>

// Alternativa al QR: el anfitrión marca a mano a quien ha llegado.
function openManualArrivals(id){
  const p = getPlan(id); if (!p) return;
  p.manualIn = p.manualIn || [];
  const people = USERS.filter(u => u.id !== 'me' && !u.managedBy).slice(0, Math.max(1, Math.min(6, p.joined || 0)));

      ${people.map(u => { const on = p.manualIn.includes(u.id);
        return `<div class="au-person"><span class="avatar conv-av">${escapeHtml(u.initials || initials(u.name))}</span><span class="conv-main"><b>${escapeHtml(u.name)}</b><span>${on ? 'Ha llegado' : 'Apuntado'}</span></span>
          <button class="ph-btn ${on ? '' : 'primary'} au-fbtn" onclick="toggleManualArrival('${id}','${u.id}')">${on ? 'Deshacer' : 'Ha llegado'}</button></div>`; }).join('') || '<p class="hint">Aún no hay nadie apuntado.</p>'}
    </div></div>`);

function toggleManualArrival(id, uid){
  const p = getPlan(id); if (!p) return; p.manualIn = p.manualIn || [];

/* ---------- índice de fiabilidad ----------
   Se muestra agregado: cuántas veces no se presentó, nunca a qué planes. */
function reliability(){
  const st = ME.stats || {};
  const att = new Set([...(ME.attendedPlanIds || []), ...state.attended]).size, ns = st.noShows || 0;
  return { pct: att + ns ? Math.round(att / (att + ns) * 100) : 100, attended: att, noShows: ns, late: st.lateCancels || 0 };
}

function saveEditPlan(id){

    planChatSystem(id, 'Cambio en el plan: ' + changes.join(' · '));
    state.reconfirmed = new Set([...state.reconfirmed].filter(x => x !== id));   // con un cambio importante, se vuelve a reconfirmar

/* ---------- chat del plan ---------- */
function planChat(id){ return CONVERSATIONS.find(c => c.type === 'plan' && c.planId === id); }
function ensurePlanChat(id){
  const p = getPlan(id); if (!p) return null;
  let c = planChat(id);
  if (!c){

/* ---------- respuestas simuladas del "otro lado" ---------- */
// El anfitrión decide tu solicitud (en la demo, la acepta a los pocos segundos).
function simulateHostDecision(planId, decision){
  const p = getPlan(planId), r = REQUESTS.find(x => x.planId === planId && x.userId === 'me' && x.status === 'pendiente');
  if (!p || !r) return;
  r.status = decision || 'aceptada'; state.requested.delete(planId);
  if (r.status === 'aceptada' && p.paid){   // de pago: aceptado, falta pagar (24 h)
    const x = newPayment(p, 'me', 'pendiente'); x.dueAt = Date.now() + PAY_WINDOW_HOURS * 3600000;
    notify('solicitud', `Te han aceptado en ${p.title}. Paga ${money(p.price)} en las próximas ${PAY_WINDOW_HOURS} h para confirmar tu plaza.`, { planId });
  }
  else if (r.status === 'aceptada'){ state.joined.add(planId); p.joined = (p.joined || 0) + 1; ensurePlanChat(planId); notify('solicitud', `Te han aceptado en ${p.title}. Ya estás apuntado.`, { planId }); }
  else notify('solicitud', `No hay plaza para ti en ${p.title} esta vez.`, { planId });
  saveState();
  if (location.hash === '#/plan/' + planId) renderDetail(planId);
}
// Alguien pide ir a tu plan con aprobación.
function simulateIncomingRequest(planId){
  const p = getPlan(planId); if (!p || p.approval !== 'manual') return;
  const who = USERS.find(u => u.id === 'nora') || USERS[1];
  REQUESTS.push({ id:'r' + Date.now(), planId, userId: who.id, status:'pendiente', message:'¡Hola! Me encantaría ir. Es mi primera vez en un plan así.' });
  notify('solicitud', `${who.name} quiere ir a ${p.title}.`, { planId, route:'solicitudes/' + planId });
  saveState();
}

/* ---------- quién está en el plan: visibilidad, chinchetas y saludos ----------
   Al registrar tu llegada eliges quién te ve en el plan y en el mapa (todos los del plan,
   solo amigos o nadie) y si vas solo o en grupo. Los que estáis en el plan os veis como
   chinchetas en el punto del plan (nunca en la posición exacta de nadie), con enlace al
   perfil. Se puede enviar un mensaje o solo un saludo: una chincheta animada que dice
   "yo también estoy en este plan". Solo mientras dura el plan. Ver docs/bucle-de-planes.md. */
const PLAN_VIS = [['todos','Todos los del plan','globe'],['amigos','Amigos','heartO'],['nadie','Nadie','lock']];
const PLAN_MODE = [['solo','Voy solo','user'],['grupo','Voy en grupo','users'],['','No decirlo','close']];
const VIS_HINT = {
  todos: 'Te ven todos los que han registrado su llegada a este plan, en el plan y en el mapa, y pueden saludarte.',
  amigos: 'Solo te ven tus amigos (os seguís los dos) que estén en el plan.',
  nadie: 'No apareces. Cuentas en el total del plan, pero nadie ve que estás. Puedes ver a los demás y saludar: al saludar, esa persona sabrá que estás.',
};
function myPresence(planId){ return Object.assign({ vis: state.presencePublic ? 'todos' : 'nadie', mode: '' }, (ME.planPresence || {})[planId] || {}); }
function setPlanPresence(planId, k, v){
  ME.planPresence = Object.assign({}, ME.planPresence, { [planId]: Object.assign(myPresence(planId), { [k]: v }) });
  const p = getPlan(planId);
  // La lista pública de asistentes solo muestra a quien es visible para todos.
  if (p && state.attended.has(planId) && k === 'vis'){
    const listed = p.publicAttendees.includes(ME.initials);
    if (v === 'todos' && !listed){ p.publicAttendees.unshift(ME.initials); p.attendedPrivate = Math.max(0, (p.attendedPrivate || 0) - 1); }
    if (v !== 'todos' && listed){ p.publicAttendees = p.publicAttendees.filter(x => x !== ME.initials); p.attendedPrivate = (p.attendedPrivate || 0) + 1; }
  }
  saveState(); if (location.hash === '#/plan/' + planId) renderDetail(planId);
}
// El plan está en marcha (en la demo, siempre que hayas registrado tu llegada).
function planLive(p){ return !!p && !isCancelled(p) && (DEMO_CHECKIN_ANYTIME || (Date.now() >= p.when - CHECKIN_BEFORE_MIN * 60000 && Date.now() <= p.when.getTime() + CHECKIN_AFTER_MIN * 60000)); }
const amHere = (planId) => state.attended.has(planId) && planLive(getPlan(planId));
// Quién ves tú en el plan: solo si tú también estás, y según la visibilidad de cada uno.
function peopleHere(planId){
  if (!amHere(planId)) return [];
  return (PLAN_PRESENCE[planId] || []).filter(e => {
    const u = getUser(e.userId);
    if (!u || (ME.blocked || []).includes(u.id) || isSanctioned(u.id)) return false;
    return e.vis === 'todos' || (e.vis === 'amigos' && areFriends('me', u.id));
  }).map(e => Object.assign({ u: getUser(e.userId) }, e));
}
const pinged = (planId, uid) => !!((ME.pinged || {})[planId + ':' + uid]);
// Posición de cada chincheta alrededor del punto del plan (fija para cada persona).
function pinSpot(uid, i){
  let h = 0; for (const ch of String(uid)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const a = (h % 360) * Math.PI / 180, r = 18 + (h % 17) + i * 2;
  return { x: 50 + Math.cos(a) * r * 1.3, y: 52 + Math.sin(a) * r };
}
const modeLabel = (m) => m === 'solo' ? 'Va solo' : (m === 'grupo' ? 'Va en grupo' : '');
function pingIcon(cls){ return `<span class="ping-ic ${cls || ''}" aria-hidden="true"><i class="ping-ring"></i><i class="ping-ring r2"></i>${ico('pin')}</span>`; }
// Bloque "Tu presencia en el plan" de la ficha.
function presenceBlock(p){
  const me = myPresence(p.id);
  const seg = (k, opts) => `<div class="iseg">${opts.map(([v, l, n]) => `<button class="${me[k] === v ? 'active' : ''}" onclick="setPlanPresence('${p.id}','${k}','${v}')">${ico(n)}<span>${l}</span></button>`).join('')}</div>`;
  return `<div class="block"><h4>Tu presencia en el plan</h4>
    <span class="sb-l">Quién te ve en el plan y en el mapa</span>${seg('vis', PLAN_VIS)}
    <p class="hint">${VIS_HINT[me.vis]}</p>
    <span class="sb-l">Cómo vas</span>${seg('mode', PLAN_MODE)}
    <p class="hint">Da igual ir solo o en grupo. Si vas solo, decirlo ayuda a que otros se animen a saludarte.</p></div>`;
}
// Bloque "Aquí ahora": chinchetas en el punto del plan y la lista para saludar o escribir.
function hereNowBlock(p){
  const place = getPlace(p.placeId);
  if (!amHere(p.id)) return (state.joined.has(p.id) || p.joinType === 'libre') && planLive(p) && !isCancelled(p)
    ? `<div class="block"><h4>Aquí ahora</h4><p class="hint">${ico('geo')} Cuando registres tu llegada verás quién más está en el plan y podrás saludar.</p></div>` : '';
  const people = peopleHere(p.id), me = myPresence(p.id);
  const pins = people.map((e, i) => { const s = pinSpot(e.u.id, i);
    return `<button class="here-pin" style="left:${s.x.toFixed(1)}%;top:${s.y.toFixed(1)}%" onclick="go('u/${e.u.id}')" aria-label="Perfil de ${escapeHtml(e.u.name)}"><span class="avatar sm">${escapeHtml(e.u.initials || initials(e.u.name))}</span></button>`; }).join('');
  const mine = me.vis !== 'nadie' ? `<button class="here-pin me" style="left:50%;top:52%" onclick="go('perfil')" aria-label="Tú">${pingIcon('sm')}<span class="here-me">Tú</span></button>` : '';
  const solos = people.filter(e => e.mode === 'solo').length;
  return `<div class="block"><h4>Aquí ahora · ${people.length + 1} ${people.length ? 'personas' : 'persona'}</h4>
    <div class="here-map" aria-label="Quién está en el plan"><span class="here-venue">${ico('pin')} ${escapeHtml(p.secret ? 'Punto del plan' : (place ? place.name : 'Punto del plan'))}</span>${pins}${mine}</div>
    <p class="hint">Todos aparecéis en el punto del plan, nunca en vuestra ubicación exacta. Solo os veis quienes habéis registrado la llegada, y solo mientras dura.${solos ? ` ${solos} ${solos === 1 ? 'ha venido solo' : 'han venido solos'}: buen momento para saludar.` : ''}</p>
    ${me.vis === 'nadie' ? `<p class="hint">${ico('lock')} Ahora no te ven. Si saludas a alguien, sabrá que estás.</p>` : ''}
    ${people.map(e => `<div class="here-row"><button class="avatar conv-av" onclick="go('u/${e.u.id}')" aria-label="Perfil de ${escapeHtml(e.u.name)}">${escapeHtml(e.u.initials || initials(e.u.name))}</button>
      <button class="conv-main lnk" onclick="go('u/${e.u.id}')"><b>${escapeHtml(e.u.name)}</b><span>${escapeHtml([modeLabel(e.mode), areFriends('me', e.u.id) ? 'Amigos' : ''].filter(Boolean).join(' · ') || e.u.handle)}</span></button>
      <button class="ping-btn ${pinged(p.id, e.u.id) ? 'done' : ''}" onclick="sendPing('${e.u.id}','${p.id}')" ${pinged(p.id, e.u.id) ? 'disabled' : ''} aria-label="Decirle a ${escapeHtml(e.u.name)} que tú también estás aquí">${pingIcon()}<span>${pinged(p.id, e.u.id) ? 'Saludado' : 'Yo también'}</span></button>
      <button class="here-msg" onclick="openDm('${e.u.id}')" aria-label="Enviar un mensaje a ${escapeHtml(e.u.name)}">${ico('chat')}</button></div>`).join('')
      || '<p class="hint">Aún no hay nadie visible. Si alguien llega y se deja ver, aparecerá aquí.</p>'}
  </div>`;
}
// Saludo: un mensaje con la chincheta animada, "yo también estoy en este plan". Uno por persona y plan.
function sendPing(uid, planId){
  const p = getPlan(planId), u = getUser(uid);
  if (!p || !u || pinged(planId, uid) || !amHere(planId)) return;
  const c = dmWith(uid, true);
  if (c.status !== 'aceptada') c.status = 'aceptada';   // estar en el mismo plan cuenta como conoceros
  c.messages.push({ id: newId('m'), from:'me', ping: planId, min:0 });
  ME.pinged = Object.assign({}, ME.pinged, { [planId + ':' + uid]: Date.now() });
  saveState(); toast(`${u.name.split(' ')[0]} sabe que tú también estás aquí`);
  if (location.hash === '#/plan/' + planId) renderDetail(planId);
  setTimeout(() => pingBack(uid, planId), 2500);   // demo: te devuelve el saludo
}
function pingBack(uid, planId){
  const p = getPlan(planId), u = getUser(uid), c = dmWith(uid, false); if (!p || !u || !c) return;
  c.messages.push({ id: newId('m'), from: uid, ping: planId, min:0 });
  if (location.hash === '#/chat/' + c.id) renderChat(c.id);
  else { c.unread = (c.unread || 0) + 1; updateDmBadge(); notify('aqui', `${u.name} también está en ${p.title} y te ha saludado.`, { convId: c.id }); }
  saveState();
}
// En el chat del plan: avisar a todos de que ya estás.
function pingPlanChat(planId, convId){
  const c = getConversation(convId); if (!c || !amHere(planId) || c.messages.some(m => m.from === 'me' && m.ping === planId)) return;
  c.messages.push({ id: newId('m'), from:'me', ping: planId, min:0 }); saveState(); renderChat(convId);
}
function pingBubble(m){
  const p = getPlan(m.ping) || { title:'el plan' };
  return `<span class="bubble ping-msg">${pingIcon('anim')}<span>${m.from === 'me' ? 'Yo también' : 'También'} estoy en <b>${escapeHtml(p.title)}</b></span></span>`;
}


/* =========================================================================
   Social (simulado en el navegador): fotos, carruseles y vídeos de verdad desde la
   cámara o la galería; menú de cada publicación (editar el pie, eliminar, reportar);
   guardados y etiquetadas en el perfil; seguidores y seguidos; perfiles privados con
   solicitudes de seguimiento; búsqueda de personas, planes y #temas; página de cada
   tema; y la pestaña de Menciones con aceptar o quitar.
   Lo que hará el servidor de verdad: docs/social.md.
   ========================================================================= */
const MAX_ITEMS = 10;                 // fotos por carrusel
const MAX_VIDEO_S = 60, MAX_VIDEO_MB = 50;
const PHOTO_MAX_PX = 1350;

/* ---------- almacén de fotos y vídeos (IndexedDB) ----------
   Las publicaciones guardan "m:<id>"; el archivo vive en IndexedDB (admite vídeos,
   que no caben en localStorage) y se sirve con una URL de objeto. */
const MEDIA = {};
function idbOpen(){
  return new Promise((res, rej) => {
    if (typeof indexedDB === 'undefined') return rej(new Error('sin IndexedDB'));
    const r = indexedDB.open('planes-media', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('m');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function objUrl(blob){ try { return URL.createObjectURL(blob); } catch (e) { return ''; } }
function putMedia(id, blob){
  MEDIA[id] = objUrl(blob);
  return idbOpen().then(db => new Promise(res => { const tx = db.transaction('m', 'readwrite'); tx.objectStore('m').put(blob, id); tx.oncomplete = res; tx.onerror = res; }), () => {});
}
function deleteMedia(id){
  delete MEDIA[id];
  return idbOpen().then(db => new Promise(res => { const tx = db.transaction('m', 'readwrite'); tx.objectStore('m').delete(id); tx.oncomplete = res; tx.onerror = res; }), () => {});
}
function loadAllMedia(){
  return idbOpen().then(db => new Promise(res => {
    const req = db.transaction('m').objectStore('m').openCursor();
    req.onsuccess = () => { const c = req.result; if (c){ if (!MEDIA[c.key]) MEDIA[c.key] = objUrl(c.value); c.continue(); } else res(Object.keys(MEDIA).length); };
    req.onerror = () => res(0);
  }), () => 0);
}
const mediaUrl = (ref) => (ref && ref.startsWith('m:')) ? (MEDIA[ref.slice(2)] || '') : '';

/* ---------- subir fotos y vídeos al crear una publicación ---------- */
function canvasBlob(canvas, quality){ return new Promise(res => canvas.toBlob(b => res(b), 'image/jpeg', quality)); }
// Reduce la foto y la vuelve a codificar: así también se quita la ubicación GPS (EXIF).
function photoToBlob(file){
  return new Promise((resolve, reject) => {
    const url = objUrl(file), img = new Image();
    img.onerror = reject;
    img.onload = () => {
      const k = Math.min(1, PHOTO_MAX_PX / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      canvasBlob(c, 0.85).then(resolve, reject);
    };
    img.src = url;
  });
}
// Duración y miniatura (primer fotograma) de un vídeo.
function videoInfo(file){
  return new Promise((resolve, reject) => {
    const v = document.createElement('video'); v.preload = 'metadata'; v.muted = true; v.playsInline = true;
    v.onerror = () => reject(new Error('vídeo no válido'));
    v.onloadedmetadata = () => { v.currentTime = Math.min(0.5, (v.duration || 1) / 2); };
    v.onseeked = () => {
      const k = Math.min(1, 720 / Math.max(v.videoWidth || 720, v.videoHeight || 720));
      const c = document.createElement('canvas'); c.width = Math.round((v.videoWidth || 720) * k); c.height = Math.round((v.videoHeight || 720) * k);
      try { c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); } catch (e) {}
      canvasBlob(c, 0.8).then(poster => resolve({ duration: Math.round(v.duration || 0), poster }), reject);
    };
    v.src = objUrl(file);
  });
}
function draftItems(){ return state.draftPost.items || (state.draftPost.items = []); }
// Añade un elemento al borrador (también lo usan las pruebas).
function addDraftItem(item){ const items = draftItems(); items.push(Object.assign({ id: 'd' + Date.now() + items.length }, item)); syncDraftKind(); }
function syncDraftKind(){
  const items = draftItems();
  if (!items.length) return;
  state.draftPost.kind = items.some(i => i.type === 'video') ? 'video' : (items.length > 1 ? 'carrusel' : 'foto');
}
function removeDraftItem(id){ capturePostInputs(); state.draftPost.items = draftItems().filter(i => i.id !== id); syncDraftKind(); if (!draftItems().length) state.draftPost.kind = 'foto'; renderCreatePost(); }
function pickPostMedia(input){
  const files = Array.from((input && input.files) || []); if (!files.length) return;
  capturePostInputs();
  const videos = files.filter(f => /^video\//.test(f.type)), photos = files.filter(f => /^image\//.test(f.type));
  const items = draftItems();
  if (videos.length){
    if (videos.length > 1 || photos.length || items.length){ toast('Un vídeo va solo: sube un vídeo, o hasta 10 fotos'); return; }
    const f = videos[0];
    if (f.size > MAX_VIDEO_MB * 1024 * 1024){ toast(`El vídeo pesa demasiado (máximo ${MAX_VIDEO_MB} MB en la demo)`); return; }
    toast('Preparando el vídeo…');
    videoInfo(f).then(info => {
      if (info.duration > MAX_VIDEO_S){ toast(`El vídeo dura ${info.duration} s: el máximo es ${MAX_VIDEO_S} s`); return; }
      addDraftItem({ type:'video', blob:f, url:objUrl(f), poster:info.poster, posterUrl:objUrl(info.poster), duration:info.duration });
      renderCreatePost();
    }, () => toast('No se ha podido leer el vídeo'));
    return;
  }
  if (items.some(i => i.type === 'video')){ toast('Ya hay un vídeo: quítalo para subir fotos'); return; }
  const room = MAX_ITEMS - items.length;
  if (room <= 0){ toast(`Máximo ${MAX_ITEMS} fotos por carrusel`); return; }
  if (photos.length > room) toast(`Solo caben ${room} fotos más (máximo ${MAX_ITEMS})`);
  Promise.all(photos.slice(0, room).map(photoToBlob)).then(blobs => {
    blobs.forEach(b => addDraftItem({ type:'image', blob:b, url:objUrl(b) }));
    renderCreatePost();
  }, () => toast('No se ha podido leer alguna foto'));
}
// Vista previa de lo subido, con botón para quitar cada elemento.
function draftPreviewHtml(sticker){
  const items = draftItems();
  if (!items.length) return '';
  if (items[0].type === 'video') return `<div class="post-prev"><span class="pp g-dark"><video class="pp-video" src="${items[0].url || ''}" poster="${items[0].posterUrl || ''}" playsinline muted loop controls></video>
    <button class="sv-x pv-x" onclick="removeDraftItem('${items[0].id}')" aria-label="Quitar el vídeo">${ico('close')}</button>${sticker}</span></div>
    <p class="hint">${items[0].duration || 0} s · máximo ${MAX_VIDEO_S} s.</p>`;
  return `<div class="post-prev ${items.length > 1 ? 'carrusel' : ''}">${items.map((it, i) => `<span class="pp g-dark"><img class="cover-img" src="${it.url}" alt="">
      ${items.length > 1 ? `<span class="pp-n">${i + 1}</span>` : ''}<button class="sv-x pv-x" onclick="removeDraftItem('${it.id}')" aria-label="Quitar la foto ${i + 1}">${ico('close')}</button></span>`).join('')}${sticker}</div>
    <p class="hint">${items.length} de ${MAX_ITEMS} fotos. Quitamos la ubicación GPS que guardan las fotos.</p>`;
}
// Al publicar: guarda los archivos y devuelve las referencias para la publicación.
function commitDraftMedia(){
  const items = draftItems(); if (!items.length) return null;
  const stamp = Date.now();
  if (items[0].type === 'video'){
    const vid = 'v' + stamp, pid = 'p' + stamp;
    if (items[0].blob) putMedia(vid, items[0].blob); else if (items[0].url) MEDIA[vid] = items[0].url;
    if (items[0].poster) putMedia(pid, items[0].poster); else if (items[0].posterUrl) MEDIA[pid] = items[0].posterUrl;
    return { kind:'video', video:'m:' + vid, imgs:['m:' + pid], duration: items[0].duration || 15 };
  }
  const imgs = items.map((it, i) => { const id = 'i' + stamp + '_' + i; if (it.blob) putMedia(id, it.blob); else if (it.url) MEDIA[id] = it.url; return 'm:' + id; });
  return { kind: imgs.length > 1 ? 'carrusel' : 'foto', imgs };
}
function toggleRealVideo(el){ const v = el.querySelector('video'); if (!v) return; if (v.paused){ v.play(); el.classList.add('playing'); } else { v.pause(); el.classList.remove('playing'); } }
function toggleVideoSound(ev, el){ if (ev && ev.stopPropagation) ev.stopPropagation(); const v = el.closest('.pm').querySelector('video'); if (!v) return; v.muted = !v.muted; el.classList.toggle('on', !v.muted); }

/* ---------- menú de cada publicación ---------- */

    <div class="sheet-h"><span>Publicación</span><button class="sv-x" onclick="closeOverlay()" aria-label="Cerrar">${ico('close')}</button></div>
    <div class="sheet-list">
      ${mine ? `<button class="sh-row" onclick="openEditCaption('${id}')">${ico('doc')}<span>Editar el pie</span>${ico('chevR')}</button>
        <button class="sh-row danger" onclick="openDeletePost('${id}')">${ico('close')}<span>Eliminar publicación</span>${ico('chevR')}</button>`
      : `<button class="sh-row" onclick="closeOverlay();toggleFollowQuiet('${u.id}')">${ico('user')}<span>${follows('me', u.id) ? 'Dejar de seguir' : 'Seguir'} a ${escapeHtml(u.name)}</span>${ico('chevR')}</button>
        <button class="sh-row danger" onclick="openReport('${u.id}', null, { objectType:'publicacion', postId:'${id}' })">${ico('alert')}<span>Reportar</span>${ico('chevR')}</button>`}
      <button class="sh-row" onclick="closeOverlay();copyShareLink('${id}')">${ico('link')}<span>Copiar enlace</span>${ico('chevR')}</button>
    </div></div>`);
}
function toggleFollowQuiet(uid){ toggleFollow(uid, true); if (state.contentTab === 'vividas' && location.hash.startsWith('#/feed')) renderContent(); }
function openEditCaption(id){
  const po = POSTS.find(p => p.id === id); if (!po) return;
  showOverlay('ov-sheet', `<div class="sheet-bg" onclick="closeOverlay()"></div><div class="sheet" role="dialog" aria-label="Editar el pie">
    <div class="sheet-h"><span>Editar el pie</span><button class="sv-x" onclick="closeOverlay()" aria-label="Cerrar">${ico('close')}</button></div>
    <div class="sheet-list form"><div class="field"><label for="f-ecap">Pie ${counter('f-ecap','caption',po.caption)}</label>
      <textarea ${lim('f-ecap','caption')} rows="4">${escapeHtml(po.caption || '')}</textarea></div>
      <button class="btn-primary" onclick="saveCaption('${id}')">${ico('check')} Guardar</button></div></div>`);
}
function saveCaption(id){
  const po = POSTS.find(p => p.id === id); if (!po) return;
  const cap = clip(val('f-ecap'), 'caption') || po.caption;
  guardText(cap, { kind:'publicacion', onEdit: () => openEditCaption(id) }, flag => {
    po.caption = cap; if (flag) po.held = true;
    commitCaption(po);
    return { objectType:'publicacion', postId:id };
  });
}
function commitCaption(po){
  const id = po.id;
  po.mentions = po.caption.match(MENTION_RE) || []; po.hashtags = po.caption.match(/#[\wáéíóúñ]+/gi) || []; po.edited = true;

/* ---------- quién ve qué: perfiles privados y audiencia ---------- */

const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function allHashtags(){
  const count = {};
  POSTS.filter(canSeePost).forEach(p => (String(p.caption || '').match(/#[\wáéíóúñ]+/gi) || []).forEach(t => { const k = t.slice(1).toLowerCase(); count[k] = (count[k] || 0) + 1; }));
  PLACES.forEach(pl => { if (pl.hashtag){ const k = pl.hashtag.replace(/^#/, '').toLowerCase(); count[k] = count[k] || 0; } });
  return Object.entries(count).map(([tag, n]) => ({ tag, n })).sort((a, b) => b.n - a.n);
}
function searchAll(q){

  const tags = allHashtags().filter(t => norm(t.tag).includes(n));

const mentionKey = (kind, postId, idx) => `${kind}:${postId}${idx != null ? ':' + idx : ''}`;
function mentionStatus(key){ return ((ME.mentions || {})[key]) || 'pendiente'; }
function mentionAllowed(authorId){
  const pol = ME.mentionPolicy || 'todos';
  if ((ME.blocked || []).includes(authorId)) return false;
  return pol === 'todos' || (pol === 'seguidos' && follows('me', authorId));
}
function myMentions(){
  const h = (ME.handle || '').toLowerCase(); const out = [];
  if (!h) return out;
  const hasMe = (text) => (String(text || '').match(MENTION_RE) || []).some(m => m.toLowerCase() === h);
  POSTS.forEach(p => {
    if (p.authorId === 'me' || !canSeePost(p)) return;
    if ((p.taggedUserIds || []).includes('me') && mentionAllowed(p.authorId)) out.push({ key: mentionKey('tag', p.id), kind:'tag', post:p, by:p.authorId });
    if (hasMe(p.caption) && mentionAllowed(p.authorId)) out.push({ key: mentionKey('post', p.id), kind:'post', post:p, by:p.authorId });
    (p.comments || []).forEach((c, i) => { if (c.userId !== 'me' && hasMe(c.text) && mentionAllowed(c.userId)) out.push({ key: mentionKey('com', p.id, i), kind:'com', post:p, by:c.userId, text:c.text }); });
