/* ---------- recibir desde el menú de compartir del móvil ----------
   Con la app instalada (Android), "planes" sale en el menú de compartir de la galería o
   del navegador (share_target del manifest). El service worker (sw.js) guarda lo recibido
   y abre #/recibido: fotos o vídeo → nueva publicación; un enlace de planes → se abre. */
const SHARE_INBOX = 'planes-compartido';
function receiveShared(){
  const fallback = () => go('feed');
  if (typeof caches === 'undefined') return fallback();
  caches.open(SHARE_INBOX).then(c => c.match('compartido/meta').then(r => r ? r.json() : null).then(meta => {
    if (!meta) return fallback();
    return Promise.all(Array.from({ length: Math.min(meta.n || 0, MAX_ITEMS) }, (_, i) => c.match('compartido/' + i).then(r => r ? r.blob() : null)))
      .then(blobs => c.keys().then(ks => Promise.all(ks.map(k => c.delete(k)))).then(() => applyShared(meta, blobs.filter(Boolean))));
  })).catch(fallback);
}
// Ruta de la app si lo recibido es un enlace de planes (dominio real o web del prototipo).
function sharedLink(text){
  const s = String(text || '');
  const m = s.match(/abrir\.html#\/(plan|p|u|tema)\/([\w.%-]+)/) || s.match(/(?:planes\.app|\/web)\/(plan|p|u|tema)\/([\w.%-]+?)(?:\.html)?(?=$|[\s?#"'<>])/);
  if (!m) return null;
  if (m[1] === 'u' && !getUser(m[2])){ const u = USERS.find(x => String(x.handle).replace(/^@/, '') === m[2]); return u ? 'u/' + u.id : null; }
  return m[1] + '/' + m[2];
}
function applyShared(meta, blobs){
  const text = [meta.title, meta.text, meta.url].filter(Boolean).join(' ').trim();
  const link = sharedLink(text);
  if (link && !blobs.length){ go(link); return; }
  state.draftPost = freshPostDraft(); state.draftPost.origin = 'vida';
  state.draftPost.caption = clip([meta.text, meta.url].filter(Boolean).join(' '), 'caption');
  go('crear-post'); renderCreatePost(); showView('page');
  if (blobs.length){
    const files = blobs.map((b, i) => typeof File !== 'undefined' ? new File([b], 'compartido-' + i, { type: b.type }) : Object.assign(b, { name: 'compartido-' + i }));
    pickPostMedia({ files });
  }
  toast(blobs.length ? 'Recibido: revisa y publica' : 'Texto recibido en el pie');
}


/* =========================================================================
   Confianza y seguridad (simulado en el navegador). En la app real todo esto lo
   decide y lo guarda el servidor: ver docs/confianza-y-seguridad.md.
   - Filtros automáticos de contenido: avisan antes de publicar o retienen.
   - Reportes y bloqueos, "Tus reportes", "Estado de tu cuenta" y apelaciones.
   - Panel interno de moderación: cola, SOS, apelaciones e historial.
   - Contactos de confianza y botón SOS.
   - Tus datos (RGPD): descargar una copia, consentimientos y borrar la cuenta.
   ========================================================================= */

// Id único aunque se creen varios en el mismo milisegundo.
function newId(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ---------- filtros automáticos de contenido ----------
   Normaliza el texto (minúsculas, sin tildes, números por letras, sin letras repetidas,
   letras sueltas unidas) para que "1d10t4", "idiotaaa" o "i d i o t a" también cuenten.
   En la app real: clasificadores en el servidor (texto e imagen) + listas mantenidas por
   el equipo; esto es solo una muestra de las reglas. */
const FILTER_CATS = {
  amenaza: { level:'retener', label:'una amenaza', reason:'peligro' },
  odio:    { level:'retener', label:'discurso de odio', reason:'acoso' },
  spam:    { level:'retener', label:'spam o un intento de estafa', reason:'spam' },
  insulto: { level:'aviso',   label:'un insulto', reason:'acoso' },
  contacto:{ level:'aviso',   label:'tus datos de contacto', reason:null },
};
const FILTER_RULES = {
  amenaza: [/\bte voy a (matar|reventar|partir la cara|encontrar|buscar)\b/, /\b(te|os) mato\b/, /\bse donde vives\b/, /\bojala te mueras\b/, /\bmatate\b/, /\bvas a pagarlo\b/, /\bte vas a enterar\b/],
  odio:    [/\bsudacas?\b/, /\bmaricon(es)?\b/, /\bpanchit[oa]s?\b/, /\bnegrat[ao]s?\b/],
  insulto: [/\bidiot[ao]s?\b/, /\bimbecil(es)?\b/, /\bgilipol(a)?s\b/, /\bsubnormal(es)?\b/, /\bestupid[ao]s?\b/, /\bpringa(d[ao]|o)s?\b/, /\bcapul[oa]s?\b/, /\bcabron(a|es|as)?\b/, /\bput[ao]s?\b/, /\bzoras?\b/, /\bretrasad[ao]s?\b/, /\basco de gente\b/],
};
const SPAM_BAIT = /(gana(r)?\s+\d+|dinero (facil|rapido)|€\s*(a|al|por)\s*(la\s+)?(semana|dia|mes)|euros?\s*(a|al|por)\s*(la\s+)?(semana|dia|mes)|cripto|bitcoin|apuestas|inversion|trabaja desde casa|desde casa)/;
const LINK_RE = /(https?:\/\/|www\.|bit\.ly|\b[a-z0-9-]+\.(com|net|io|xyz|link|ly|top|click)\b)/i;
const PHONE_RE = /(\+?\d[\d\s.-]{7,}\d)/;
const EMAIL_RE = /[\w.+-]+@[\w-]+\.[\w.]+/;

function normText(s){
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[0134578@$]/g, c => ({ '0':'o', '1':'i', '3':'e', '4':'a', '5':'s', '7':'t', '8':'b', '@':'a', '$':'s' }[c]))
    .replace(/\b(?:[a-z][\s.\-_*]){2,}[a-z]\b/g, m => m.replace(/[\s.\-_*]/g, ''))   // "i d i o t a" → "idiota"
    .replace(/([a-z])\1+/g, '$1')                                                     // "idiotaaa" → "idiota"
    .replace(/\s+/g, ' ');
}
// ctx.kind: comentario | publicacion | mensaje | plan | bio. ctx.known: en mensajes, si conoces a la persona.
function moderateText(text, ctx){
  ctx = ctx || {};
  const raw = String(text || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const t = normText(text);
  const hit = (cat) => ({ cat, ...FILTER_CATS[cat] });
  if (FILTER_RULES.amenaza.some(re => re.test(t))) return hit('amenaza');
  if (FILTER_RULES.odio.some(re => re.test(t))) return hit('odio');
  if ((LINK_RE.test(raw) && SPAM_BAIT.test(raw)) || (raw.match(new RegExp(SPAM_BAIT.source, 'g')) || []).length >= 2) return hit('spam');
  if (FILTER_RULES.insulto.some(re => re.test(t))) return hit('insulto');
  const digits = ((raw.match(PHONE_RE) || [''])[0].match(/\d/g) || []).length;
  if (ctx.kind !== 'bio' && !ctx.known && (digits >= 9 || EMAIL_RE.test(raw))) return hit('contacto');
  return { level:'ok' };
}

// Pasa el texto por el filtro antes de publicarlo. commit(flag) crea el contenido (retenido
// si flag.level === 'retener') y devuelve su referencia para la cola de moderación.
function guardText(text, ctx, commit){
  const r = moderateText(text, ctx);
  if (r.level === 'aviso'){ state.guard = { r, ctx, commit, text }; return openNudge(); }
  if (r.level === 'retener' && ctx.kind === 'bio'){ toast('La descripción no se ha guardado: parece ' + r.label); return; }
  const ref = commit(r.level === 'retener' ? r : null);
  if (r.level === 'retener' && ref) holdForReview(r, ref, text);
}
function openNudge(){
  const g = state.guard; if (!g) return;
  const contact = g.r.cat === 'contacto';
  showOverlay('ov-sheet', `<div class="sheet-bg" onclick="nudgeEdit()"></div><div class="sheet" role="dialog" aria-label="Antes de publicar">
    <div class="sheet-h"><span>${contact ? 'Cuidado con tus datos' : '¿Seguro que quieres publicarlo?'}</span><button class="sv-x" onclick="nudgeEdit()" aria-label="Cerrar">${ico('close')}</button></div>
    <div class="sheet-list form"><div class="nudge">${ico(contact ? 'lock' : 'alert')}<p>${contact
      ? 'Estás compartiendo un teléfono o un email. Hasta que conozcas a la persona en un plan, es más seguro hablar por el chat de la app.'
      : 'Parece que incluye ' + escapeHtml(g.r.label) + '. En planes pedimos respeto: si lo publicas, se mostrará a menos gente y cualquiera podrá reportarlo.'}</p></div>
      <blockquote class="nudge-q">${escapeHtml(g.text)}</blockquote>
      <button class="btn-primary" onclick="nudgeEdit()">Editar</button>
      <button class="btn-ghost" onclick="nudgeGo()">${contact ? 'Enviar igualmente' : 'Publicar igualmente'}</button></div></div>`);
}
function nudgeEdit(){ const g = state.guard; state.guard = null; closeOverlay(); if (g && g.ctx.onEdit) g.ctx.onEdit(g.text); }
function nudgeGo(){
  const g = state.guard; if (!g) return; state.guard = null; closeOverlay();
  const ref = g.commit(null);
  // Un insulto publicado tras el aviso va a la cola con prioridad baja y se muestra a menos gente.
  if (ref && g.r.cat === 'insulto'){
    const c = contentOf(ref); if (c) c.flagged = 'insulto';
    REPORTS.push(Object.assign({ id:newId('rp'), reporterId:null, targetUserId:'me', reason:'acoso', autoCategory:'insulto', evidence:g.text, source:'automatico', status:'en_cola', at:Date.now() }, ref));
    saveState();
  }
}
// Retenido: no lo ve nadie más hasta que lo revisa una persona del equipo. Se puede apelar.
function holdForReview(r, ref, text){
  const a = Object.assign({ id:newId('ma'), targetUserId:'me', action:'retener', reason:r.reason, autoCategory:r.cat, evidence:text, automated:true, status:'en_revision', at:Date.now(), appeal:null }, ref);
  MOD_ACTIONS.unshift(a);
  REPORTS.push(Object.assign({ id:newId('rp'), reporterId:null, targetUserId:'me', reason:r.reason, autoCategory:r.cat, evidence:text, source:'automatico', status:'en_cola', at:Date.now(), modActionId:a.id }, ref));
  saveState();
  showOverlay('ov-sheet', `<div class="sheet-bg" onclick="closeOverlay()"></div><div class="sheet" role="dialog" aria-label="En revisión">
    <div class="sheet-h"><span>En revisión</span><button class="sv-x" onclick="closeOverlay()" aria-label="Cerrar">${ico('close')}</button></div>
    <div class="sheet-list form"><div class="nudge">${ico('shield')}<p>Nuestro filtro automático cree que puede ser ${escapeHtml(r.label)}, así que de momento solo lo ves tú. Lo revisará una persona del equipo, normalmente en menos de 24 horas.</p></div>
      <p class="hint">Si crees que es un error, puedes apelar desde Ajustes ▸ Estado de tu cuenta.</p>
      <button class="btn-primary" onclick="closeOverlay();go('estado-cuenta')">Ver el estado de mi cuenta</button>
      <button class="btn-ghost" onclick="closeOverlay()">Entendido</button></div></div>`);
}

/* ---------- contenido referenciado por reportes y decisiones ---------- */
function contentOf(x){
  if (!x) return null;
  if (x.objectType === 'publicacion') return POSTS.find(p => p.id === x.postId) || null;
  if (x.objectType === 'comentario'){ const po = POSTS.find(p => p.id === x.postId); return (po && (po.comments || []).find(c => c.id === x.commentId)) || null; }
  if (x.objectType === 'mensaje'){ const c = getConversation(x.convId); return (c && c.messages.find(m => m.id === x.msgId)) || null; }
  if (x.objectType === 'plan') return getPlan(x.planId) || null;
  if (x.objectType === 'chispa') return IDEAS.find(i => i.id === x.ideaId) || null;
  return null;
}
const OBJECT_LABEL = { usuario:'Perfil', conversacion:'Mensajes', publicacion:'Publicación', comentario:'Comentario', mensaje:'Mensaje', plan:'Plan', chispa:'Chispa' };
function ensureCommentIds(po){ (po.comments || []).forEach((c, i) => { if (!c.id) c.id = po.id + '-c' + i; }); }
// Comentarios que ves: sin los retirados, los retenidos de otros, los de cuentas bloqueadas o suspendidas.
function commentVisible(c){
  if (c.removed) return false;
  if (c.userId === 'me') return true;
  if (c.held || (ME.blocked || []).includes(c.userId) || isSanctioned(c.userId)) return false;
  return true;
}
function visibleComments(po){ return (po.comments || []).filter(commentVisible); }

/* ---------- estado de moderación de cada cuenta ---------- */
function userMod(uid){ return Object.assign({ strikes:0, status:'activa', until:null, reach:'normal', canHost:true }, USER_MOD[uid] || {}); }
function setUserMod(uid, patch){ USER_MOD[uid] = Object.assign(userMod(uid), patch); }
function isSanctioned(uid){ const m = userMod(uid); return m.status === 'expulsada' || (m.status === 'suspendida' && (!m.until || m.until > Date.now())); }
function sanctionNote(u){
  const m = userMod(u.id);
  if (m.status === 'expulsada') return 'Esta cuenta ya no está disponible.';
  if (isSanctioned(u.id)) return 'Cuenta suspendida temporalmente por incumplir las normas.';
  return '';
}

/* ---------- reportes ---------- */
const SEVERITY = { peligro:'critica', menor:'critica', acoso:'alta', sexual:'alta', estafa:'media', suplantacion:'media', spam:'baja', otro:'baja' };
const SEVERITY_INFO = { critica:['Crítica', '1 h', 0], alta:['Alta', '24 h', 1], media:['Media', '48 h', 2], baja:['Baja', '72 h', 3] };
const REASON_RULE = {
  spam:'Spam, publicidad no pedida y ventas fuera de la app', acoso:'Respeto: sin acoso, insultos ni odio', sexual:'Contenido sexual solo con consentimiento',
  suplantacion:'Identidad real: no hacerse pasar por otra persona', estafa:'Pagos y estafas', menor:'Solo mayores de 18 años',
  peligro:'Seguridad: sin amenazas ni violencia', otro:'Normas de la comunidad',
};
const reasonLabel = (r) => ((REPORT_REASONS.find(([v]) => v === r) || [null, 'Otro motivo'])[1]);
function severityOf(rp){ return rp.autoCategory === 'amenaza' ? 'critica' : (SEVERITY[rp.reason] || 'baja'); }
function myReports(){ return REPORTS.filter(r => (r.reporterId === undefined || r.reporterId === 'me') && r.source !== 'automatico'); }
// Pruebas que se guardan con el reporte: el texto del contenido o los últimos mensajes.
function reportEvidence(r){
  const obj = r.obj || {};
  const c = contentOf(obj);
  if (c) return c.text || c.caption || [c.title, c.summary].filter(Boolean).join(' · ') || '';
  if (r.convId){ const conv = getConversation(r.convId); return conv ? conv.messages.filter(m => m.from === r.uid && m.text).slice(-3).map(m => m.text).join(' / ') : ''; }
  return '';
}
function reportComment(postId, commentId){

}
function reportPlan(planId){

  openReport(p.hostId || (p.host.business ? 'azotea' : null), null, { objectType:'plan', planId });
}
function openUserMenu(uid){

  showOverlay('ov-sheet', `<div class="sheet-bg" onclick="closeOverlay()"></div><div class="sheet" role="dialog" aria-label="Opciones">

      <button class="sh-row" onclick="openReport('${u.id}', null, { objectType:'usuario' })">${ico('alert')}<span>Reportar</span>${ico('chevR')}</button>

        : `<button class="sh-row danger" onclick="blockUser('${u.id}')">${ico('lock')}<span>Bloquear</span>${ico('chevR')}</button>`}
    </div></div>`);
}
const REPORT_STATUS = { en_cola:'En revisión', resuelto:'Resuelto', desestimado:'Sin infracción' };
function renderMyReports(){
  const view = document.getElementById('view-page');

      return `<div class="mod-card mine"><div class="mod-top"><b>${escapeHtml(u.name)}</b><span class="st st-${r.status}">${REPORT_STATUS[r.status] || r.status}</span></div>
        <div class="mod-meta">${OBJECT_LABEL[r.objectType] || 'Perfil'} · ${escapeHtml(reasonLabel(r.reason))}${r.at ? ' · ' + dayLabel(r.at) : ''}</div>

        ${r.status === 'desestimado' && !r.appeal ? `<button class="link-btn" onclick="openAppeal('report:${r.id}')">No estoy de acuerdo: pedir otra revisión</button>` : ''}
        ${r.appeal ? `<p class="hint">${ico('clock')} Revisión pedida · ${APPEAL_STATUS[r.appeal.status]}</p>` : ''}</div>`; }).join('')
      || `<div class="empty-tab"><span class="empty-ic">${ico('shield')}</span><p>No has reportado nada.</p></div>`}
  </div>`;

function resolutionText(r){ return r.status === 'desestimado' ? 'Lo hemos revisado y no incumple las normas.' : 'Lo hemos revisado y hemos actuado: ' + (MOD_ACTION_TYPES[r.resolution] || ['', ''])[1].toLowerCase() + '.'; }
function dayLabel(at){ const m = Math.max(0, Math.floor((Date.now() - at) / 60000)); return m < 1440 ? minLabel(m) : `hace ${Math.round(m / 1440)} d`; }

/* ---------- cuentas bloqueadas ---------- */
function renderBlocked(){

      <span class="conv-main"><b>${escapeHtml(u.name)}</b><span>${escapeHtml(u.handle)}</span></span>
      <button class="ph-btn sm" onclick="unblockUser('${u.id}')">Desbloquear</button></div>`).join('')

  </div>`;

/* ---------- decisiones de moderación ---------- */
const MOD_ACTION_TYPES = {
  desestimar: ['close', 'Desestimar: no incumple las normas'],
  publicar:   ['check', 'Publicar: el filtro se equivocó'],
  retirar:    ['close', 'Retirar el contenido'],
  aviso:      ['alert', 'Retirar y dar un aviso a la cuenta'],
  alcance:    ['eye', 'Reducir el alcance de la cuenta'],
  organizar:  ['ticket', 'Quitarle la opción de organizar planes'],
  suspender7: ['clock', 'Suspender la cuenta 7 días'],
  suspender30:['clock', 'Suspender la cuenta 30 días'],
  expulsar:   ['lock', 'Cerrar la cuenta para siempre'],
  autoridades:['shield', 'Escalar a las autoridades'],
  reembolsar: ['euro', 'Reembolsar al asistente (no se paga al anfitrión)'],
  retener:    ['clock', 'Retenido por el filtro automático'],
};
// Exposición de motivos (art. 17 de la Ley de Servicios Digitales): qué, por qué, con qué
// norma, si fue automático y cómo recurrir.
function statementFor(a){
  return `${MOD_ACTION_TYPES[a.action][1]}. Motivo: ${reasonLabel(a.reason)}. Norma: ${REASON_RULE[a.reason] || REASON_RULE.otro}. `
    + (a.automated ? 'Decisión tomada por un sistema automático.' : 'Decisión tomada por una persona del equipo.')
    + ' Puedes apelar en los próximos 6 meses.';
}
function applyModAction(reportId, action){
  const rp = REPORTS.find(r => r.id === reportId); if (!rp) return;
  const uid = rp.targetUserId, c = contentOf(rp), days = { suspender7:7, suspender30:30 }[action];
  if (action === 'publicar' || (action === 'desestimar' && c && c.held)) { if (c) c.held = false; }
  if (['retirar','aviso','suspender7','suspender30','expulsar'].includes(action) && c){ c.removed = true; c.held = false; }
  if (action === 'aviso') setUserMod(uid, { strikes: userMod(uid).strikes + 1 });
  if (action === 'alcance') setUserMod(uid, { reach:'reducido' });
  if (action === 'organizar') setUserMod(uid, { canHost:false });
  if (days) setUserMod(uid, { status:'suspendida', until: Date.now() + days * 86400000, strikes: userMod(uid).strikes + 1 });
  if (action === 'expulsar') setUserMod(uid, { status:'expulsada', until:null });
  if (action === 'autoridades') rp.escalated = true;
  const dismissed = action === 'desestimar' || action === 'publicar';
  // Reclamación de un pago (pagos.js): si se le da la razón, se reembolsa; si no, sigue el pago al anfitrión.
  if (rp.paymentId) resolveClaim(rp.paymentId, !dismissed);
  rp.status = dismissed ? 'desestimado' : 'resuelto'; rp.resolution = action; rp.resolvedAt = Date.now();
  // Lo retenido por el filtro: la decisión del equipo sustituye a la automática.
  const held = rp.modActionId && MOD_ACTIONS.find(a => a.id === rp.modActionId);
  if (held){ held.status = dismissed ? 'revocada' : 'vigente'; held.action = dismissed ? 'retener' : action; held.automated = false; held.decidedAt = Date.now(); }
  else if (!dismissed) MOD_ACTIONS.unshift({ id:newId('ma'), reportId, targetUserId:uid, action, objectType:rp.objectType, postId:rp.postId, commentId:rp.commentId, convId:rp.convId, msgId:rp.msgId, planId:rp.planId,
    reason:rp.reason, evidence:rp.evidence, automated:false, status:'vigente', at:Date.now(), appeal:null });
  const who = (getUser(uid) || { name:'' }).name;
  if (rp.reporterId === 'me' || rp.reporterId === undefined) notify('seguridad', `Hemos revisado tu reporte sobre ${who}. ${resolutionText(rp)}`, { route:'mis-reportes' });
  if (uid === 'me') notify('seguridad', dismissed ? 'Lo que estaba en revisión ya está publicado: no incumple las normas.' : 'Hemos retirado contenido tuyo por incumplir las normas. Puedes apelar.', { route:'estado-cuenta' });
  saveState(); closeOverlay(); toast('Decisión aplicada: ' + MOD_ACTION_TYPES[action][1].toLowerCase());
  renderModeration(state.modTab);
}

/* ---------- apelaciones ---------- */
const APPEAL_STATUS = { pendiente:'en revisión', estimada:'te damos la razón', desestimada:'se mantiene la decisión' };
// key: "action:<id>" (una decisión sobre ti) o "report:<id>" (un reporte tuyo desestimado).
function openAppeal(key){
  state.appealKey = key;
  showOverlay('ov-sheet', `<div class="sheet-bg" onclick="closeOverlay()"></div><div class="sheet" role="dialog" aria-label="Apelar">
    <div class="sheet-h"><span>Apelar</span><button class="sv-x" onclick="closeOverlay()" aria-label="Cerrar">${ico('close')}</button></div>
    <div class="sheet-list form"><p class="hint">Lo revisará una persona distinta de la que decidió. Te contestamos en unos días.</p>
      <div class="field"><label for="f-appeal">Cuéntanos por qué no estás de acuerdo ${counter('f-appeal','message','')}</label>
        <textarea ${lim('f-appeal','message')} rows="4"></textarea></div>
      <button class="btn-primary" onclick="submitAppeal()">Enviar apelación</button></div></div>`);
}
function submitAppeal(){
  const key = state.appealKey || '', text = clip(val('f-appeal'), 'message');
  if (!text){ toast('Escribe por qué no estás de acuerdo'); return; }
  const [kind, id] = key.split(':');
  const target = kind === 'report' ? REPORTS.find(r => r.id === id) : MOD_ACTIONS.find(a => a.id === id);
  if (!target || target.appeal) return;
  target.appeal = { text, status:'pendiente', at:Date.now() };
  saveState(); closeOverlay(); toast('Apelación enviada');
  if (kind === 'report') renderMyReports(); else renderAccountStatus();
}
function resolveAppeal(key, accept){
  const [kind, id] = key.split(':');
  if (kind === 'report'){
    const rp = REPORTS.find(r => r.id === id); if (!rp || !rp.appeal) return;
    rp.appeal.status = accept ? 'estimada' : 'desestimada';
    if (accept){ rp.status = 'en_cola'; rp.resolution = null; }   // vuelve a la cola
    notify('seguridad', accept ? 'Vamos a revisar de nuevo tu reporte.' : 'Hemos revisado tu petición: el reporte no incumple las normas.', { route:'mis-reportes' });
  } else {
    const a = MOD_ACTIONS.find(x => x.id === id); if (!a || !a.appeal) return;
    a.appeal.status = accept ? 'estimada' : 'desestimada';
    if (accept){
      const c = contentOf(a); if (c){ c.removed = false; c.held = false; }
      if (['suspender7','suspender30','expulsar'].includes(a.action)) setUserMod(a.targetUserId, { status:'activa', until:null });
      if (a.action === 'organizar') setUserMod(a.targetUserId, { canHost:true });
      if (a.action === 'alcance') setUserMod(a.targetUserId, { reach:'normal' });
      a.status = 'revocada';
      REPORTS.filter(r => r.modActionId === a.id && r.status === 'en_cola').forEach(r => { r.status = 'desestimado'; r.resolution = 'publicar'; });
    }
    if (a.targetUserId === 'me') notify('seguridad', accept ? 'Te damos la razón: hemos anulado la decisión y tu contenido vuelve a estar visible.'
      : 'Hemos revisado tu apelación y mantenemos la decisión. Si no estás de acuerdo, puedes acudir a un órgano de resolución extrajudicial.', { route:'estado-cuenta' });
  }
  saveState(); toast(accept ? 'Apelación estimada' : 'Decisión mantenida'); renderModeration('apelaciones');
}

function addTrusted(){
  const name = clip(val('f-tname'), 'name'), phone = val('f-tphone').trim();
  if (!name){ toast('Escribe un nombre'); return; }
  if ((phone.match(/\d/g) || []).length < 9 || !/^\+?[\d\s.-]+$/.test(phone)){ toast('Escribe un teléfono válido'); return; }
  if (trustedContacts().length >= MAX_TRUSTED) return;
  const c = { id:newId('tc'), name, phone, status:'pendiente' };
  ME.trustedContacts = [...trustedContacts(), c]; saveState();
  toast(`Le hemos enviado un SMS a ${name.split(' ')[0]} para que acepte`); renderTrusted();
  setTimeout(() => { const x = trustedContacts().find(t => t.id === c.id); if (x){ x.status = 'aceptado'; saveState(); if (location.hash === '#/contactos-confianza') renderTrusted(); } }, 3000);   // demo: acepta
}
function removeTrusted(id){ ME.trustedContacts = trustedContacts().filter(c => c.id !== id); saveState(); renderTrusted(); }

const contactNames = () => trustedContacts().map(c => c.name.split(' ')[0]);
function planShared(planId){ return (ME.shareTrips && state.joined.has(planId)) || SAFETY_EVENTS.some(e => e.type === 'compartir' && e.planId === planId); }
function activeSos(planId){ return SAFETY_EVENTS.find(e => e.type === 'sos' && e.status === 'activa' && (!planId || e.planId === planId)); }

}
function arrivedSafe(planId){
  SAFETY_EVENTS.unshift({ id:newId('se'), type:'llegada', planId, at:Date.now(), contacts:contactNames() }); saveState();

function sendSos(planId){
  const ev = { id:newId('se'), type:'sos', planId, at:Date.now(), status:'activa', contacts:contactNames(), location:null };
  SAFETY_EVENTS.unshift(ev); saveState(); closeOverlay();

  try {

/* ---------- tus datos (RGPD) ---------- */
const CONSENTS = [
  ['marketing', 'Novedades y planes destacados por email', 'Consentimiento. Opcional.'],
  ['ubicacion', 'Ubicación para planes cerca de ti', 'Permiso del móvil. Sin él, eliges la ciudad a mano.'],
  ['analitica', 'Estadísticas de uso para mejorar la app', 'Consentimiento. Opcional.'],
  ['personalizacion', 'Recomendaciones según tu actividad', 'Interés legítimo: puedes oponerte.'],
];
function consentValue(k){
  if (k === 'marketing'){ const a = currentAccount(); return !!(a && a.consents && a.consents.marketing); }
  if (k === 'ubicacion') return !!ME.locationAllowed;
  const c = ME.consents || {}; return k === 'personalizacion' ? c[k] !== false : !!c[k];
}
function toggleConsent(k){
  const v = !consentValue(k);
  if (k === 'marketing'){ const a = currentAccount(); if (a) updateAccount(a.id, { consents: Object.assign({}, a.consents, { marketing:v }) }); }
  else if (k === 'ubicacion') ME.locationAllowed = v;
  else ME.consents = Object.assign({}, ME.consents, { [k]: v });
  ME.consentLog = [...(ME.consentLog || []), { key:k, value:v, at:new Date().toISOString() }].slice(-50);   // registro de cambios
  saveState(); renderMyData();
}

  return { posts: mine.length, comments: POSTS.reduce((s, p) => s + (p.comments || []).filter(c => c.userId === 'me').length, 0),
    ratings: RATINGS.filter(r => r.userId === 'me').length, messages: CONVERSATIONS.reduce((s, c) => s + c.messages.filter(m => m.from === 'me').length, 0) };
}
// Copia de tus datos (art. 15 y 20 del RGPD) en JSON legible por máquina.
function buildExport(){
  const a = currentAccount() || {};
  const strip = ({ hash, salt, ...rest }) => rest;   // la contraseña (cifrada) no se exporta
  return {
    generado: new Date().toISOString(), formato: 'planes-export-v1',
    cuenta: strip(a),
    perfil: { nombre:ME.name, usuario:ME.handle, descripcion:ME.bio, ciudad:ME.city, idiomas:ME.languages, intereses:ME.interests, perfilPublico:ME.profilePublic, presenciaPublica:ME.presencePublic, verificado:!!ME.verified, negocio:ME.business || null },

    publicaciones: POSTS.filter(p => p.authorId === 'me'),
    comentarios: POSTS.flatMap(p => (p.comments || []).filter(c => c.userId === 'me').map(c => ({ publicacion:p.id, ...c }))),
    meGusta: POSTS.filter(p => p.likedByMe).map(p => p.id), guardados: POSTS.filter(p => p.savedByMe).map(p => p.id),
    valoraciones: RATINGS.filter(r => r.userId === 'me'),
    sigues: FOLLOWS.filter(f => f[0] === 'me').map(f => f[1]), teSiguen: FOLLOWS.filter(f => f[1] === 'me').map(f => f[0]),
    planes: { apuntado:[...state.joined], asistidos:ME.attendedPlanIds || [], organizados:PLANS.filter(p => p.hostId === 'me').map(p => ({ ...p, when: p.when instanceof Date ? p.when.toISOString() : p.when })) },
    mensajes: CONVERSATIONS.map(c => ({ id:c.id, tipo:c.type, con:c.with || null, plan:c.planId || null, mios:c.messages.filter(m => m.from === 'me') })),
    notificaciones: NOTIFICATIONS, bloqueados: ME.blocked || [],
    reportesEnviados: myReports().map(({ reporterId, ...r }) => r),
    decisionesSobreTi: MOD_ACTIONS.filter(x => x.targetUserId === 'me'),

    chispas: IDEAS.filter(x => x.authorId === 'me'), respuestasAChispas: IDEAS.filter(x => x.people.some(p => p.userId === 'me')).map(x => ({ chispa: x.id, estado: myIdeaStatus(x) })),
    pagos: PAYMENTS.filter(x => x.userId === 'me'), formasDePago: PAYMENT_METHODS.map(({ brand, last4, exp }) => ({ brand, last4, exp })),

    consentimientos: { marketing: consentValue('marketing'), ubicacion: consentValue('ubicacion'), analitica: consentValue('analitica'), personalizacion: consentValue('personalizacion'), registro: ME.consentLog || [] },

}
function exportMyData(){
  const json = JSON.stringify(buildExport(), null, 2);
  if (typeof Blob === 'undefined'){ toast('Este navegador no puede generar el archivo'); return; }
  saveFile(new Blob([json], { type:'application/json' }), `planes-mis-datos-${new Date().toISOString().slice(0, 10)}.json`).then(r => {
    if (r === 'saved') toast('Copia de tus datos descargada'); else if (r !== 'declined') toast('No se ha podido guardar el archivo');
  });
}


/* =========================================================================
   Pagos (simulado en el navegador). En la app real: Stripe Connect, con el cobro en la
   plataforma y la transferencia al anfitrión después del plan. Ver docs/pagos.md.
   - Reservar y pagar un plan (tarjeta guardada o nueva, pago con el móvil, 3D Secure).
   - Dinero retenido hasta el plan; se paga al anfitrión 48 h después, menos el 15 %.
   - Reembolsos según la política de cancelación; el 100 % si cancela el anfitrión.
   - Reclamaciones: pausan el pago al anfitrión y van al panel de moderación.
   - Cobros del anfitrión: alta (datos fiscales, IBAN, verificación), saldo y facturas.
   - Recibos de cada pago y factura mensual de la comisión.
   ========================================================================= */
const COMMISSION = 0.15;            // comisión de planes (IVA incluido)
const VAT = 0.21;                   // IVA de la comisión
const RELEASE_HOURS = 48;           // se paga al anfitrión 48 h después del plan, si nadie reclama
const PAY_WINDOW_HOURS = 24;        // aceptado en un plan de pago: 24 h para pagar
const STRIPE_FEE = { pct: 0.015, fixed: 0.25 };   // tarjetas europeas (orientativo): lo asume planes
// Tarjetas de prueba (las de Stripe): cualquier otra válida se acepta.
const TEST_CARDS = { '4000002760003184': '3ds', '4000000000000002': 'rechazada', '4000000000009995': 'fondos' };

const round2 = (n) => Math.round(n * 100) / 100;
const money = (n) => (round2(n) % 1 ? round2(n).toFixed(2) : String(round2(n))).replace('.', ',') + ' €';
const money2 = (n) => round2(n).toFixed(2).replace('.', ',') + ' €';   // en recibos y facturas, siempre con céntimos
// Reparto de un importe cobrado: comisión (con su IVA) y lo que recibe el anfitrión.
function splitFor(gross){
  const fee = round2(gross * COMMISSION), base = round2(fee / (1 + VAT));
  return { gross: round2(gross), fee, feeBase: base, feeVat: round2(fee - base), net: round2(gross - fee), stripe: gross ? round2(gross * STRIPE_FEE.pct + STRIPE_FEE.fixed) : 0 };
}
const myPayment = (planId) => PAYMENTS.filter(x => x.userId === 'me' && x.planId === planId && !x.past).slice(-1)[0] || null;
const PAY_STATUS = { pendiente:'Falta pagar', retenido:'Retenido hasta el plan', liberado:'Celebrado · en camino al anfitrión', pagado:'Pagado al anfitrión',
  reembolsado:'Reembolsado', reembolso_parcial:'Reembolso parcial', en_revision:'Reclamación en revisión' };
function nextReceiptNo(){
  const n = PAYMENTS.reduce((m, x) => Math.max(m, parseInt(String(x.receiptNo || '').split('-').pop(), 10) || 0), 117) + 1;
  return 'PL-' + new Date().getFullYear() + '-' + String(n).padStart(6, '0');
}
function newPayment(p, userId, status){
  const x = { id: newId('pay'), planId: p.id, planTitle: p.title, hostName: (p.host || {}).name || '', userId, amount: p.price, refunded: 0,
    status, at: Date.now(), receiptNo: nextReceiptNo(), intent: 'pi_' + Math.random().toString(36).slice(2, 12) };
  PAYMENTS.push(x); return x;
}

/* ---------- reservar y pagar ---------- */
// Política de cancelación de un plan, con números (la misma que se enseña antes de pagar).
function policyLine(p){ const pol = CANCEL_POLICIES[p.cancelPolicy || 'flexible']; return `Cancelación ${pol.label.toLowerCase()}: ${pol.text}`; }
function openCheckout(planId){
  const p = getPlan(planId); if (!p) return;
  state.checkout = state.checkout && state.checkout.planId === planId ? state.checkout
    : { planId, method: (PAYMENT_METHODS.find(m => m.isDefault) || PAYMENT_METHODS[0] || { id:'nueva' }).id, save: true, err: '' };
  renderCheckout();
}
function renderCheckout(){
  const ck = state.checkout, p = getPlan(ck.planId); if (!p) return;
  const place = getPlace(p.placeId), pend = myPayment(p.id);
  const methods = PAYMENT_METHODS.map(m => `<button class="pay-opt ${ck.method === m.id ? 'on' : ''}" role="radio" aria-checked="${ck.method === m.id}" onclick="setCheckout('method','${m.id}')">
      <span class="rep-dot"></span>${ico('card')}<span>${escapeHtml(m.brand)} ···· ${escapeHtml(m.last4)}<span class="or-s">Caduca ${escapeHtml(m.exp)}</span></span></button>`).join('');
  showOverlay('ov-sheet', `<div class="sheet-bg" onclick="closeOverlay()"></div><div class="sheet" role="dialog" aria-label="Pagar la reserva">
    <div class="sheet-h"><span>Reservar plaza</span><button class="sv-x" onclick="closeOverlay()" aria-label="Cerrar">${ico('close')}</button></div>
    <div class="sheet-list form">
      <div class="ck-plan"><span class="mini-thumb ${p.gradient}">${coverImg(p.photo, 120)}</span><span><b>${escapeHtml(p.title)}</b>
        <span class="or-s">${fmtWhen(new Date(p.when))} · ${escapeHtml(p.secret ? 'Zona aproximada' : (place ? place.name : 'Madrid'))}</span></span></div>
      <div class="ck-row"><span>1 plaza</span><b>${money2(p.price)}</b></div>
      ${pend && pend.status === 'pendiente' ? `<p class="hint">${ico('clock')} Te han aceptado: paga antes de ${fmtWhen(new Date(pend.dueAt))} para confirmar tu plaza.</p>` : ''}
      <div class="pay-note">${ico('shield')}<p><b>Pago protegido.</b> Lo retenemos hasta el plan; al anfitrión le llega después de celebrarse. Si no se celebra, te devolvemos el 100 %.</p></div>
      <p class="hint">${escapeHtml(policyLine(p))}</p>
      <button class="btn-ghost pay-wallet" onclick="payWithWallet()">${ico('phone')} Pagar con el móvil (Apple Pay o Google Pay)</button>
      <div class="pay-or"><span>o con tarjeta</span></div>
      <div class="rep-list" role="radiogroup">${methods}
        <button class="pay-opt ${ck.method === 'nueva' ? 'on' : ''}" role="radio" aria-checked="${ck.method === 'nueva'}" onclick="setCheckout('method','nueva')"><span class="rep-dot"></span>${ico('plus')}<span>Tarjeta nueva</span></button></div>
      ${ck.method === 'nueva' ? `<div class="field"><label for="f-card">Número de tarjeta</label><input id="f-card" inputmode="numeric" autocomplete="cc-number" placeholder="1234 1234 1234 1234" maxlength="23" value="${escapeHtml(ck.card || '')}"></div>
        <div class="ck-two"><div class="field"><label for="f-exp">Caducidad</label><input id="f-exp" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/AA" maxlength="5" value="${escapeHtml(ck.exp || '')}"></div>
          <div class="field"><label for="f-cvc">CVC</label><input id="f-cvc" inputmode="numeric" autocomplete="cc-csc" placeholder="123" maxlength="4"></div></div>
        <div class="opt-row" onclick="setCheckout('save', ${!ck.save})"><span class="or-ic">${ico('lock')}</span><span class="or-l">Guardar para la próxima vez</span><span class="switch ${ck.save ? 'on' : ''}"><span class="knob"></span></span></div>
        <p class="hint">Demo: 4242 4242 4242 4242 paga; 4000 0027 6000 3184 pide confirmar en tu banco; 4000 0000 0000 0002 es rechazada.</p>` : ''}
      ${ck.err ? `<p class="pay-err" role="alert">${ico('alert')} ${escapeHtml(ck.err)}</p>` : ''}
      <button class="btn-primary" onclick="payNow()">Pagar ${money2(p.price)}</button>
      <p class="hint">Los datos de la tarjeta van directamente al procesador de pagos (Stripe); planes no los guarda.</p>
    </div></div>`);
}
function setCheckout(k, v){ captureCard(); state.checkout[k] = v; state.checkout.err = ''; renderCheckout(); }
function captureCard(){ const ck = state.checkout; if (!ck || ck.method !== 'nueva') return; ck.card = val('f-card'); ck.exp = val('f-exp'); }
function luhn(num){ let sum = 0; num.split('').reverse().forEach((d, i) => { let n = +d; if (i % 2){ n *= 2; if (n > 9) n -= 9; } sum += n; }); return sum % 10 === 0; }
function cardBrand(num){ return /^4/.test(num) ? 'Visa' : (/^(5[1-5]|2[2-7])/.test(num) ? 'Mastercard' : (/^3[47]/.test(num) ? 'American Express' : 'Tarjeta')); }
// Comprueba la tarjeta como haría el formulario de Stripe. Devuelve un error o null.
function cardError(num, exp, cvc){
  if (!/^\d{13,19}$/.test(num) || !luhn(num)) return 'El número de la tarjeta no es válido.';
  const m = exp.match(/^(\d{2})\/(\d{2})$/); if (!m || +m[1] < 1 || +m[1] > 12) return 'Escribe la caducidad como MM/AA.';
  const end = new Date(2000 + +m[2], +m[1], 1); if (end <= new Date()) return 'La tarjeta está caducada.';
  if (!/^\d{3,4}$/.test(cvc)) return 'El CVC son los 3 o 4 números de detrás.';
  return null;
}
function payNow(){
  const ck = state.checkout; if (!ck) return;
  captureCard();
  let method = PAYMENT_METHODS.find(m => m.id === ck.method), outcome = 'ok';
  if (ck.method === 'nueva'){
    const num = (ck.card || '').replace(/\D/g, ''), exp = (ck.exp || '').trim(), cvc = val('f-cvc').trim();
    const err = cardError(num, exp, cvc); if (err){ ck.err = err; renderCheckout(); return; }
    outcome = TEST_CARDS[num] || 'ok';
    method = { id: newId('pm'), brand: cardBrand(num), last4: num.slice(-4), exp, isDefault: !PAYMENT_METHODS.length };
    ck.newMethod = method;
  }
  if (!method){ ck.err = 'Elige cómo pagar.'; renderCheckout(); return; }
  if (outcome === 'rechazada'){ ck.err = 'Tu banco ha rechazado el pago. Prueba con otra tarjeta.'; renderCheckout(); return; }
  if (outcome === 'fondos'){ ck.err = 'La tarjeta no tiene saldo suficiente.'; renderCheckout(); return; }
  if (outcome === '3ds') return open3ds(method);
  completePayment(method);
}
// Autenticación reforzada (PSD2 / 3D Secure): el banco pide confirmar el pago.
function open3ds(method){
  state.checkout.pending = method;
  showOverlay('ov-sheet', `<div class="sheet-bg"></div><div class="sheet" role="dialog" aria-label="Confirma el pago">
    <div class="sheet-h"><span>Confirma el pago en tu banco</span></div>
    <div class="sheet-list form"><div class="pay-note">${ico('lock')}<p>Tu banco pide confirmar este pago de <b>${money2(getPlan(state.checkout.planId).price)}</b> (autenticación reforzada). En el móvil se abriría la app de tu banco.</p></div>
      <button class="btn-primary" onclick="completePayment(state.checkout.pending)">Confirmar el pago</button>
      <button class="btn-ghost" onclick="state.checkout.err='Has cancelado la confirmación: no se ha cobrado nada.';renderCheckout()">Cancelar</button></div></div>`);
}
function payWithWallet(){ completePayment({ id:'wallet', brand:'Pago con el móvil', last4:'', exp:'' }); }
function completePayment(method){
  const ck = state.checkout, p = ck && getPlan(ck.planId); if (!p) return;
  if (ck.newMethod && ck.save && method === ck.newMethod){
    if (!PAYMENT_METHODS.length) method.isDefault = true;
    PAYMENT_METHODS.push(method);
  }
  const label = method.last4 ? `${method.brand} ···· ${method.last4}` : method.brand;
  let x = myPayment(p.id);
  if (x && x.status === 'pendiente'){ x.status = 'retenido'; x.at = Date.now(); delete x.dueAt; }
  else x = newPayment(p, 'me', 'retenido');
  x.method = label;
  state.checkout = null; closeOverlay();
  notify('pago', `Pago de ${money2(x.amount)} para ${p.title}. Lo retenemos hasta el plan. Recibo ${x.receiptNo}.`, { route:'pagos' });
  completeJoin(p.id, `Plaza reservada · ${money(x.amount)} retenidos hasta el plan`);
}

/* ---------- cancelaciones y reembolsos ---------- */
// Al cancelar tu asistencia: se reembolsa según la política del plan.
function refundMyPayment(p, rf){
  const x = myPayment(p.id); if (!x || !['retenido','pendiente'].includes(x.status)) return null;
  if (x.status === 'pendiente'){ PAYMENTS.splice(PAYMENTS.indexOf(x), 1); return null; }
  x.refunded = round2(rf.amount);
  x.status = rf.pct >= 100 ? 'reembolsado' : (rf.pct > 0 ? 'reembolso_parcial' : 'retenido');
  x.refundReason = rf.pct >= 100 ? 'Cancelaste a tiempo: reembolso completo' : (rf.pct > 0 ? `Política ${rf.policy.label.toLowerCase()}: reembolso del ${rf.pct} %` : `Política ${rf.policy.label.toLowerCase()}: sin reembolso`);
  if (rf.pct > 0){ x.refundedAt = Date.now(); notify('pago', `Te devolvemos ${money2(x.refunded)} de ${p.title}. Llega a tu tarjeta en 5-10 días hábiles.`, { route:'pagos' }); }
  if (rf.pct === 0) x.cancelled = true;   // la plaza se pierde y el importe va al anfitrión tras el plan
  return x;
}
// El anfitrión cancela (o el plan no llega al mínimo): reembolso completo a todos.
function refundAllForPlan(p, reason){
  PAYMENTS.filter(x => x.planId === p.id && !x.past && ['retenido','reembolso_parcial','pendiente','en_revision','liberado'].includes(x.status)).forEach(x => {
    x.refunded = x.amount; x.status = 'reembolsado'; x.refundedAt = Date.now(); x.refundReason = reason;
    if (x.userId === 'me') notify('pago', `${p.title} se ha cancelado: te devolvemos ${money2(x.amount)} (el 100 %).`, { route:'pagos' });
  });
}

/* ---------- después del plan: liberar y pagar al anfitrión ---------- */
function releasePlanPayments(planId){
  PAYMENTS.filter(x => x.planId === planId && !x.past && ['retenido','reembolso_parcial'].includes(x.status)).forEach(x => {
    x.status = 'liberado'; x.releaseAt = Date.now() + RELEASE_HOURS * 3600000;
  });
}
function payoutPlan(planId){
  PAYMENTS.filter(x => x.planId === planId && x.status === 'liberado').forEach(x => { x.status = 'pagado'; x.paidOutAt = Date.now(); });
}
// Demo: el anfitrión da el plan por celebrado; a las 48 h se le paga.
function demoHostPlanDone(planId){
  const p = getPlan(planId); if (!p) return;
  releasePlanPayments(planId); saveState();
  toast(`Plan celebrado: los cobros te llegarán en ${RELEASE_HOURS} h si nadie reclama`);
  if (location.hash.startsWith('#/cobros')) renderPayouts(); else renderDetail(planId);
}
function demoPayout(planId){
  payoutPlan(planId); saveState();
  const net = hostSales(planId).reduce((s, x) => s + splitFor(x.amount - x.refunded).net, 0);
  notify('pago', `Te hemos pagado ${money2(net)} de ${(getPlan(planId) || {}).title || 'tu plan'} a tu cuenta ${maskIban((ME.payouts || {}).iban)}.`, { route:'cobros' });
  renderPayouts();
}
// Demo: llegan reservas a un plan de pago tuyo.
function demoSales(planId, n){
  const p = getPlan(planId); if (!p || !p.paid) return;
  const buyers = USERS.filter(u => u.id !== 'me' && !u.managedBy && u.type !== 'profesional').slice(0, n || 3);
  buyers.forEach(u => { const x = newPayment(p, u.id, 'retenido'); x.method = 'Tarjeta'; p.joined = (p.joined || 0) + 1; });
  saveState(); notify('pago', `${buyers.length} reservas nuevas en ${p.title}: ${money2(buyers.length * p.price)} retenidos hasta el plan.`, { route:'cobros' });
  if (location.hash.startsWith('#/cobros')) renderPayouts(); else renderDetail(planId);
}

/* ---------- reclamaciones ---------- */
const CLAIM_REASONS = [['no_celebrado','El plan no se celebró'], ['distinto','Era muy distinto de lo anunciado'], ['cobro','Me han cobrado mal'], ['otro','Otro problema']];
const canClaim = (x) => x.userId === 'me' && ['retenido','liberado'].includes(x.status) && !x.past && !x.cancelled;
function openClaim(payId){
  const x = PAYMENTS.find(y => y.id === payId); if (!x) return;
  state.claim = { payId, reason: null };
  renderClaim();
}
function renderClaim(){
  const c = state.claim, x = PAYMENTS.find(y => y.id === c.payId); if (!x) return;
  showOverlay('ov-sheet', `<div class="sheet-bg" onclick="closeOverlay()"></div><div class="sheet" role="dialog" aria-label="Tengo un problema con este plan">
    <div class="sheet-h"><span>Tengo un problema</span><button class="sv-x" onclick="closeOverlay()" aria-label="Cerrar">${ico('close')}</button></div>
    <div class="sheet-list rep"><p class="hint"><b>${escapeHtml(x.planTitle)}</b> · ${money2(x.amount)}. Mientras lo revisamos, no se paga al anfitrión.</p>
      <div class="rep-list" role="radiogroup">${CLAIM_REASONS.map(([v, l]) => `<button class="rep-opt ${c.reason === v ? 'on' : ''}" role="radio" aria-checked="${c.reason === v}" onclick="state.claim.reason='${v}';renderClaim()"><span class="rep-dot"></span>${l}</button>`).join('')}</div>
      <div class="field"><label for="f-claim">Cuéntanos qué pasó ${counter('f-claim','message','')}</label><textarea ${lim('f-claim','message')} rows="3"></textarea></div>
      <button class="btn-primary" ${c.reason ? '' : 'disabled'} onclick="submitClaim()">Enviar</button></div></div>`);
}
function submitClaim(){
  const c = state.claim, x = c && PAYMENTS.find(y => y.id === c.payId); if (!x || !c.reason) return;
  const p = getPlan(x.planId) || {}, hostId = p.hostId || (USERS.find(u => u.name === x.hostName) || {}).id || null;
  const text = clip(val('f-claim'), 'message');
  x.prevStatus = x.status; x.status = 'en_revision';

// NIF/NIE español: letra de control.
function validTaxId(id){
  const s = String(id || '').toUpperCase().replace(/[\s-]/g, '');
  const L = 'TRWAGMYFPDXBNJZSQVHLCKE';
  if (/^\d{8}[A-Z]$/.test(s)) return L[+s.slice(0, 8) % 23] === s[8];
  if (/^[XYZ]\d{7}[A-Z]$/.test(s)) return L[+(('XYZ'.indexOf(s[0])) + s.slice(1, 8)) % 23] === s[8];
  return /^[ABCDEFGHJNPQRSUVW]\d{7}[0-9A-J]$/.test(s);   // CIF de empresa: formato
}
// IBAN: dígitos de control (módulo 97).
function validIban(iban){
  const s = String(iban || '').toUpperCase().replace(/\s/g, '');
  if (!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(s) || (s.startsWith('ES') && s.length !== 24)) return false;
  const r = (s.slice(4) + s.slice(0, 4)).replace(/[A-Z]/g, c => String(c.charCodeAt(0) - 55));
  let m = 0; for (const ch of r) m = (m * 10 + +ch) % 97;
  return m === 1;
}

const IDEA_WHEN = [['hoy','Hoy'],['finde','Este finde'],['semana','Esta semana'],['fecha','Un día concreto'],['sin_fecha','Cuando nos cuadre']];

  viajeros: { limit:true,  max:6,  min:2, cost:'a_escote', why:'Para moverse juntos y repartir gastos.' },
};
const ideaLabel = (list, v) => (list.find(x => x[0] === v) || [, ''])[1];
const getIdea = (id) => IDEAS.find(x => x.id === id);
const ideaYes = (x) => x.people.filter(p => p.status === 'si');
const myIdeaStatus = (x) => (x.people.find(p => p.userId === 'me') || {}).status || null;
function ideaExpires(x){ return x.when === 'fecha' && x.date ? new Date(x.date).getTime() : (x.at || Date.now()) + IDEA_DAYS * 86400000; }
function ideaState(x){ if (x.status !== 'abierta') return x.status; return ideaExpires(x) < Date.now() ? 'caducada' : 'abierta'; }
const ideaFull = (x) => x.limit && ideaYes(x).length + 1 >= x.max;   // quien la lanza cuenta como una plaza
// Quién la ve: según "quién puede apuntarse", bloqueos y cuentas suspendidas.
function canSeeIdea(x){
  if (x.authorId === 'me') return true;
  if ((ME.blocked || []).includes(x.authorId) || isSanctioned(x.authorId) || x.removed || x.held) return false;
  if (x.who === 'seguidores') return follows('me', x.authorId) || follows(x.authorId, 'me');
  if (x.who === 'amigos') return areFriends('me', x.authorId);
  return true;
}
function visibleIdeas(){ return IDEAS.filter(x => canSeeIdea(x) && ideaState(x) === 'abierta').sort((a, b) => (b.at || 0) - (a.at || 0)); }
function whenText(x){ return x.when === 'fecha' && x.date ? fmtWhen(new Date(x.date)) : ideaLabel(IDEA_WHEN, x.when); }
function seatsText(x){ const n = ideaYes(x).length + 1; return x.limit ? `${n} de ${x.max}` : `${n} ${n === 1 ? 'persona' : 'personas'} · sin límite`; }

/* ---------- tarjetas y listas ---------- */
function ideaCard(x){
  const u = x.authorId === 'me' ? ME : (getUser(x.authorId) || { name:'' });
  const n = ideaYes(x).length + 1, reached = n >= (x.min || 1);
  return `<button class="idea-card" onclick="go('chispa/${x.id}')">
    <span class="idea-who"><span class="avatar sm">${escapeHtml(u.initials || initials(u.name))}</span><span>${x.authorId === 'me' ? 'Tú estás pensando' : escapeHtml(u.name.split(' ')[0]) + ' está pensando'}</span></span>
    <b class="idea-t">${escapeHtml(x.title)}</b>
    <span class="idea-m">${ico('clock')} ${escapeHtml(whenText(x))}</span>
    <span class="idea-m">${ico('users')} ${seatsText(x)}${reached ? '' : ` · faltan ${x.min - n}`}</span>
    <span class="idea-q">${ico('spark')} ¿Quién se anima?</span></button>`;
}
// Tira de chispas arriba de Disponibles.
function ideasStrip(){
  const list = visibleIdeas();
  return `<div class="ideas"><div class="ideas-h"><span>${ico('spark')} Chispas · ¿quién se anima?</span>
      <button class="link-btn" onclick="go('chispas')">Ver todas</button></div>
    <div class="ideas-row">${list.slice(0, 8).map(ideaCard).join('')}
      <button class="idea-card idea-new" onclick="go('crear-chispa')">${ico('plus')}<b class="idea-t">Lanza una chispa</b><span class="idea-m">"Estoy pensando… ¿alguien se anima?"</span></button></div></div>`;
}
function renderIdeas(){
  const view = document.getElementById('view-page');
  const list = visibleIdeas(), mine = IDEAS.filter(x => x.authorId === 'me' && ideaState(x) !== 'abierta');
  view.innerHTML = pageHead('Chispas') + `<div class="page-body">
    <p class="hint">Planes que alguien está pensando hacer. Si se anima suficiente gente, se convierten en plan.</p>
    <button class="btn-primary" onclick="go('crear-chispa')">${ico('spark')} Lanzar una chispa</button>
    <div class="ideas-list">${list.map(ideaCard).join('') || `<div class="empty-tab"><span class="empty-ic">${ico('spark')}</span><p>No hay chispas ahora mismo. Lanza la primera.</p></div>`}</div>
    ${mine.length ? `<div class="set-title" style="margin-top:16px">Tus chispas anteriores</div><div class="ideas-list">${mine.map(ideaCard).join('')}</div>` : ''}
  </div>`;
}

/* ---------- ficha de una chispa ---------- */
function renderIdea(id){
  const view = document.getElementById('view-page'), x = getIdea(id);
  if (!x || !canSeeIdea(x)){ view.innerHTML = pageHead('Chispa') + '<div class="empty-tab"><p>Esta chispa ya no está disponible.</p></div>'; return; }
  const mine = x.authorId === 'me', u = mine ? ME : (getUser(x.authorId) || { name:'' }), st = ideaState(x), my = myIdeaStatus(x);
  const yes = ideaYes(x), maybe = x.people.filter(p => p.status === 'quizas'), pend = x.people.filter(p => p.status === 'pendiente');
  const n = yes.length + 1, reached = n >= (x.min || 1), place = x.placeId && getPlace(x.placeId);
  const person = (p, extra) => { const v = getUser(p.userId) || { name:'' };
    return `<div class="here-row"><button class="avatar conv-av" onclick="go('u/${v.id}')" aria-label="Perfil de ${escapeHtml(v.name)}">${escapeHtml(v.initials || initials(v.name))}</button>
      <button class="conv-main lnk" onclick="go('u/${v.id}')"><b>${escapeHtml(v.name)}</b><span>${{ si:'Se apunta', quizas:'Quizás', pendiente:'Quiere ir' }[p.status]}</span></button>${extra || ''}</div>`; };
  const banner = st === 'convertida' ? `<div class="pl-banner">${ico('check')}<div><b>¡Ya es un plan!</b><p>Se animó suficiente gente.</p><div class="pl-banner-b"><button class="ph-btn primary" onclick="go('plan/${x.planId}')">Ver el plan</button></div></div></div>`
    : st === 'caducada' ? `<div class="pl-banner bad">${ico('clock')}<div><b>Esta chispa ha caducado</b><p>No llegó a convertirse en plan.</p></div></div>`
    : st === 'descartada' ? `<div class="pl-banner bad">${ico('close')}<div><b>${mine ? 'La has descartado' : 'Ya no sigue en pie'}</b></div></div>` : '';
  let actions = '';
  if (st === 'abierta' && mine) actions = `<div class="idea-acts">${reached ? `<p class="hint">${ico('check')} Ya sois ${n}: llegáis al mínimo. ¿Lo hacemos?</p>` : `<p class="hint">Faltan ${x.min - n} para el mínimo (${x.min}).${x.auto ? ' Al llegar, se hace plan solo.' : ''}</p>`}
      <button class="btn-primary" onclick="openConfirmIdea('${x.id}')">${ico('ticket')} Confirmar el plan</button>
      <button class="btn-ghost" onclick="discardIdea('${x.id}')">Descartar la chispa</button></div>`;
  else if (st === 'abierta'){
    const full = ideaFull(x) && my !== 'si';
    actions = `<div class="idea-acts">
      <div class="idea-btns"><button class="btn-join ${my === 'si' || my === 'pendiente' ? 'done' : ''}" onclick="answerIdea('${x.id}','si')" ${full ? 'disabled' : ''}>${my === 'si' ? `${ico('check')} Te apuntas` : (my === 'pendiente' ? `${ico('clock')} Pendiente de ${escapeHtml(u.name.split(' ')[0])}` : (full ? 'Completa' : `${ico('spark')} ${x.approval ? 'Quiero ir' : 'Me apunto'}`))}</button>
        <button class="ph-btn ${my === 'quizas' ? 'primary' : ''}" onclick="answerIdea('${x.id}','quizas')">Quizás</button></div>
      ${my ? `<button class="link-btn dim" onclick="answerIdea('${x.id}', null)">Ya no me interesa</button>` : ''}
      <button class="btn-ghost" onclick="openDm('${x.authorId}')">${ico('chat')} Escribir a ${escapeHtml(u.name.split(' ')[0])}</button>
      ${x.approval ? `<p class="hint">${escapeHtml(u.name.split(' ')[0])} decide quién va.</p>` : ''}
      ${x.auto ? `<p class="hint">${ico('check')} Se hace plan en cuanto lleguen al mínimo.</p>` : ''}</div>`;
  }
  view.innerHTML = `<div class="page-bar"><button class="pb-back" onclick="history.back()" aria-label="Atrás">${ico('chevL')}</button><span class="pb-title">Chispa</span>
      ${mine ? '<span style="width:34px"></span>' : `<button class="pb-back" onclick="openReport('${x.authorId}', null, { objectType:'chispa', ideaId:'${x.id}' })" aria-label="Reportar la chispa">${ico('alert')}</button>`}</div>
    <div class="page-body idea-page">
      ${banner}
      <div class="idea-who big"><button class="avatar" onclick="go('${mine ? 'perfil' : 'u/' + x.authorId}')">${escapeHtml(u.initials || initials(u.name))}</button>
        <span><b>${mine ? 'Tú' : escapeHtml(u.name)}</b> ${mine ? 'estás pensando…' : 'está pensando…'}</span></div>
      <h2 class="idea-title">${escapeHtml(x.title)}</h2>
      <p class="idea-text">${escapeHtml(x.text)}</p>
      <div class="trust-row">
        <span class="trust">${ico('clock')} ${escapeHtml(whenText(x))}</span>
        ${x.zone || place ? `<span class="trust">${ico('pin')} ${escapeHtml(x.zone || place.name)}</span>` : ''}
        <span class="trust">${ico(ICON_FOR_CAT[x.category] || 'hash')} ${escapeHtml((getCategory(x.category) || {}).label || '')}</span>
        <span class="trust">${ico('users')} ${seatsText(x)}</span>
        <span class="trust">${ico('check')} Mínimo ${x.min || 1}</span>
        <span class="trust">${ico('euro')} ${escapeHtml(ideaLabel(IDEA_COST, x.cost))}${x.costNote ? ' · ' + escapeHtml(x.costNote) : ''}</span>
        ${x.who !== 'todos' ? `<span class="trust">${ico('lock')} Solo ${x.who === 'amigos' ? 'amigos' : 'seguidores'}</span>` : ''}
      </div>
      ${actions}
      <div class="block"><h4>Se animan · ${yes.length}</h4>${yes.map(p => person(p)).join('') || '<p class="hint">Aún nadie. Sé la primera persona.</p>'}
        ${maybe.length ? `<h4 style="margin-top:12px">Quizás · ${maybe.length}</h4>${maybe.map(p => person(p)).join('')}` : ''}
        ${mine && pend.length ? `<h4 style="margin-top:12px">Quieren ir · ${pend.length}</h4>${pend.map(p => person(p, `<span class="req-q"><button class="ico-btn no" onclick="decideIdea('${x.id}','${p.userId}',false)" aria-label="Rechazar">${ico('close')}</button><button class="ico-btn ok" onclick="decideIdea('${x.id}','${p.userId}',true)" aria-label="Aceptar">${ico('check')}</button></span>`)).join('')}` : ''}
      </div>
      <p class="hint">Una chispa no es todavía un plan: no hay pago ni dirección exacta. Cuando se hace plan, a los que se apuntaron se les pide que confirmen que van en ${INVITE_HOURS} h; si no, su plaza queda libre.${st === 'abierta' ? ` Caduca ${x.when === 'fecha' ? 'en la fecha' : `a los ${IDEA_DAYS} días`} si no se convierte.` : ''}</p>
    </div>`;
}

/* ---------- responder ---------- */
function answerIdea(id, status){
  const x = getIdea(id); if (!x || ideaState(x) !== 'abierta' || x.authorId === 'me') return;
  if (status === 'si' && !requireVerified('Verifica tu identidad para apuntarte', () => answerIdea(id, status))) return;
  if (status === 'si' && ideaFull(x) && myIdeaStatus(x) !== 'si'){ toast('Ya no quedan plazas'); return; }
  x.people = x.people.filter(p => p.userId !== 'me');
  if (status) x.people.push({ userId:'me', status: status === 'si' && x.approval ? 'pendiente' : status });
  saveState();
  const u = getUser(x.authorId) || { name:'' };
  toast(status === 'si' ? (x.approval ? `Le avisamos a ${u.name.split(' ')[0]}: decide quién va` : `Te apuntas. ${u.name.split(' ')[0]} te avisará si se hace`) : (status === 'quizas' ? 'Marcado como quizás' : 'Ya no te interesa'));
  if (status === 'si' && x.approval) setTimeout(() => simulateIdeaAccept(id), 3000);   // demo: te acepta
  if (status === 'si' && !x.approval) checkIdeaReady(x);
  renderIdea(id);
}
function simulateIdeaAccept(id){
  const x = getIdea(id), p = x && x.people.find(q => q.userId === 'me' && q.status === 'pendiente'); if (!p) return;
  p.status = 'si'; saveState();
  notify('chispa', `${(getUser(x.authorId) || { name:'' }).name} te ha aceptado en su chispa "${x.title}".`, { route:'chispa/' + id });
  checkIdeaReady(x);
  if (location.hash === '#/chispa/' + id) renderIdea(id);
}
// Quien la lanza: decide (si es con aprobación), convierte en plan o descarta.
function decideIdea(id, uid, ok){
  const x = getIdea(id); if (!x || x.authorId !== 'me') return;
  const p = x.people.find(q => q.userId === uid); if (!p) return;
  if (ok && ideaFull(x)){ toast('Ya no quedan plazas'); return; }
  if (ok) p.status = 'si'; else x.people = x.people.filter(q => q.userId !== uid);
  saveState(); if (ok) checkIdeaReady(x); if (ideaState(x) === 'abierta') renderIdea(id);
}
function discardIdea(id){ const x = getIdea(id); if (!x || x.authorId !== 'me') return; x.status = 'descartada'; saveState(); toast('Chispa descartada'); renderIdea(id); }
// Convertir en plan: el formulario de plan sale relleno; al publicar, entran los que se animaron.
function convertIdea(id){
  const x = getIdea(id); if (!x || x.authorId !== 'me') return;
  const max = x.limit ? x.max : 60;
  Object.assign(state.draft, { cat: x.category, size: max <= 8 ? 'intimo' : (max <= 20 ? 'mediano' : 'grande'), access: x.approval ? 'aprobacion' : 'libre', price:'gratis',
    fromIdea: id, prefill: { title: x.title, desc: x.text, placeId: (state.ideaConfirm || {}).placeId || x.placeId || '', date: (state.ideaConfirm || {}).date || (x.when === 'fecha' && x.date ? x.date : '') } });
  go('crear-plan');
}
// Lo llama commitPlan (app.js) al publicar un plan que viene de una chispa.
function linkIdeaToPlan(plan){
  const x = getIdea(state.draft.fromIdea); state.draft.fromIdea = null; state.draft.prefill = null;
  if (!x) return;
  x.status = 'convertida'; x.planId = plan.id;
  plan.joinType = 'apuntado'; if (plan.approval === 'libre') plan.approval = 'automatica';
  // Si venía de "Confirmar el plan", pasan los que se eligieron allí.
  const c = state.ideaConfirm && state.ideaConfirm.id === x.id ? state.ideaConfirm : null; state.ideaConfirm = null;
  if (c && c.meet && !plan.meetPoint) plan.meetPoint = clip(c.meet, 'address');
  inviteFromIdea(plan, x, c ? c.picked : ideaYes(x).map(p => p.userId));
}

/* ---------- lanzar una chispa ---------- */
function freshIdeaDraft(cat){ const pr = ideaPreset(cat || 'outdoor'); return { category: cat || 'outdoor', when:'finde', date:'', zone:'', placeId:'', limit: pr.limit, max: pr.max || 8, min: pr.min, who:'todos', approval:true, auto:false, cost: pr.cost, costNote:'', title:'', text:'' }; }
function renderCreateIdea(){
  const view = document.getElementById('view-page'), d = state.ideaDraft || (state.ideaDraft = freshIdeaDraft());
  const seg = (k, opts, icons) => `<div class="iseg">${opts.map(([v, l, n]) => `<button class="${String(d[k]) === v ? 'active' : ''}" onclick="setIdeaField('${k}','${v}')">${icons && n ? ico(n) : ''}<span>${l}</span></button>`).join('')}</div>`;
  view.innerHTML = pageHead('Lanzar una chispa') + `<div class="page-body form">
    <p class="hint">${ico('spark')} Cuenta qué estás pensando hacer y mira quién se anima. Si llegáis al mínimo, lo conviertes en plan con un toque.</p>
    <div class="field"><label for="f-ititle">¿Qué te apetece? ${counter('f-ititle','planTitle',d.title)}</label><input ${lim('f-ititle','planTitle')} placeholder="Ir a pescar al pantano" value="${escapeHtml(d.title)}"></div>
    <div class="field"><label for="f-itext">Cuéntalo ${counter('f-itext','groupAbout',d.text)}</label><textarea ${lim('f-itext','groupAbout')} rows="3" placeholder="Estoy pensando ir a pescar el sábado temprano. Llevo cañas de sobra. ¿Alguien se anima?">${escapeHtml(d.text)}</textarea></div>
    <div class="field"><label>Tema</label><div class="chips">${activeCategories().map(c => `<button class="${d.category === c.id ? 'active' : ''}" onclick="setIdeaCategory('${c.id}')">${ico(ICON_FOR_CAT[c.id] || 'hash')}<span>${c.label}</span></button>`).join('')}</div>
      <p class="hint">${escapeHtml(ideaPreset(d.category).why)} Te proponemos esta configuración; cámbiala si quieres.</p></div>
    <div class="field"><label>Cuándo</label><div class="chips">${IDEA_WHEN.map(([v, l]) => `<button class="${d.when === v ? 'active' : ''}" onclick="setIdeaField('when','${v}')"><span>${l}</span></button>`).join('')}</div>
      ${d.when === 'fecha' ? `<input id="f-idate" type="datetime-local" style="margin-top:8px" value="${escapeHtml(d.date)}">` : ''}</div>
    <div class="field"><label for="f-izone">Dónde (aproximado)</label><input id="f-izone" maxlength="${LIMITS.address}" placeholder="Pantano de San Juan" value="${escapeHtml(d.zone)}">
      <p class="hint">Basta con la zona. La dirección exacta, cuando sea plan.</p></div>
    <div class="field"><label>Plazas</label>${seg('limit', [['false','Sin límite'],['true','Con límite']])}
      ${d.limit ? `<div class="ck-two" style="margin-top:8px"><div class="field"><label for="f-imax">Máximo (contigo)</label><input id="f-imax" type="number" min="2" max="100" value="${d.max}"></div>
        <div class="field"><label for="f-imin">Mínimo para hacerlo</label><input id="f-imin" type="number" min="1" max="100" value="${d.min}"></div></div>`
        : `<div class="field" style="margin-top:8px"><label for="f-imin">Mínimo para hacerlo (contigo)</label><input id="f-imin" type="number" min="1" max="100" value="${d.min}"></div>`}</div>
    <div class="field"><label>Quién puede apuntarse</label>${seg('who', IDEA_WHO, true)}
      <div class="opt-row" onclick="setIdeaField('approval', ${!d.approval})" style="margin-top:8px"><span class="or-ic">${ico('check')}</span><span class="or-l">Decido yo quién va<span class="or-s">${d.who === 'todos' ? 'recomendado si la abres a cualquiera: ' : ''}las respuestas te llegan como solicitudes</span></span><span class="switch ${d.approval ? 'on' : ''}"><span class="knob"></span></span></div></div>
    <div class="field"><label>Al llegar al mínimo</label>
      <div class="opt-row ${d.when === 'fecha' ? '' : 'off'}" onclick="${d.when === 'fecha' ? `setIdeaField('auto', ${!d.auto})` : "toast('Para hacerlo solo, elige un día concreto')"}"><span class="or-ic">${ico('ticket')}</span><span class="or-l">Hacerlo plan automáticamente<span class="or-s">${d.when === 'fecha' ? 'con el día y la zona que pones aquí' : 'solo con un día concreto'}</span></span><span class="switch ${d.auto && d.when === 'fecha' ? 'on' : ''}"><span class="knob"></span></span></div>
      <p class="hint">Si no, te avisamos y confirmas tú el plan: solo te pediremos lo que falte (día, hora y punto de encuentro).</p></div>
    <div class="field"><label>Gastos</label>${seg('cost', IDEA_COST)}
      <input id="f-icost" maxlength="60" style="margin-top:8px" placeholder="Opcional: gasolina a escote, unos 10 € por persona…" value="${escapeHtml(d.costNote)}">
      <p class="hint">En una chispa no se paga nada. Si el plan es de pago, se cobra al convertirla en plan.</p></div>
    <div class="form-actions"><button class="btn-primary" onclick="publishIdea()">${ico('spark')} Lanzar la chispa</button></div>
  </div>`;
}
function captureIdea(){
  const d = state.ideaDraft; if (!d) return;
  d.title = val('f-ititle'); d.text = val('f-itext'); d.zone = val('f-izone'); d.costNote = val('f-icost');
  const dt = document.getElementById('f-idate'); if (dt) d.date = dt.value;
  const mx = parseInt(val('f-imax'), 10), mn = parseInt(val('f-imin'), 10);
  if (mx) d.max = mx; if (mn) d.min = mn;
}
function setIdeaField(k, v){
  captureIdea(); const d = state.ideaDraft;
  d[k] = v === 'true' ? true : (v === 'false' ? false : v);
  if (k === 'approval') d.approvalTouched = true;
  // Abierta a cualquiera: "decido yo quién va" por defecto; con amigos o seguidores, entra directo.
  if (k === 'who' && !d.approvalTouched) d.approval = v === 'todos';
  renderCreateIdea();
}
function setIdeaCategory(cat){
  captureIdea(); const pr = ideaPreset(cat), d = state.ideaDraft;
  Object.assign(d, { category: cat, limit: pr.limit, max: pr.max || d.max, min: pr.min, cost: pr.cost });
  renderCreateIdea();
}
function publishIdea(){
  captureIdea(); const d = state.ideaDraft;
  const title = clip(d.title, 'planTitle'), text = clip(d.text, 'groupAbout') || '¿Alguien se anima?';
  if (!title){ toast('Cuenta qué te apetece hacer'); return; }
  if (d.when === 'fecha' && !d.date){ toast('Elige el día'); return; }
  if (d.auto && d.when === 'fecha' && !(d.zone || '').trim()){ toast('Para hacerlo solo, pon también la zona'); return; }
  if (d.limit && !(d.max >= 2 && d.max <= 100)){ toast('El máximo va de 2 a 100 personas'); return; }
  if (!(d.min >= 1) || (d.limit && d.min > d.max)){ toast('El mínimo no puede ser mayor que el máximo'); return; }
  guardText(title + '\n' + text, { kind:'publicacion' }, flag => {
    const x = { id: newId('ch'), authorId:'me', title, text, category: d.category, when: d.when, date: d.date || null, zone: clip(d.zone, 'address'), placeId: '',
      limit: !!d.limit, max: d.limit ? d.max : null, min: d.min, who: d.who, approval: !!d.approval, auto: !!(d.auto && d.when === 'fecha' && d.date && d.zone), cost: d.cost, costNote: (d.costNote || '').trim().slice(0, 60),
      people: [], status:'abierta', at: Date.now() };
    if (flag) x.held = true;
    IDEAS.unshift(x); state.ideaDraft = null; saveState();
    if (!flag){ toast('Chispa lanzada: te avisamos cuando alguien se anime'); simulateIdeaInterest(x.id); }
    go('chispa/' + x.id);
    return { objectType:'chispa', ideaId: x.id };
  });
}
// Demo: dos personas se animan a los pocos segundos.
function simulateIdeaInterest(id){
  const fans = ['nora', 'marco', 'lucia'];
  fans.slice(0, 2).forEach((uid, i) => setTimeout(() => {
    const x = getIdea(id); if (!x || ideaState(x) !== 'abierta' || x.people.some(p => p.userId === uid) || ideaFull(x)) return;
    x.people.push({ userId: uid, status: x.approval ? 'pendiente' : 'si' });
    const u = getUser(uid) || { name:'' };
    notify('chispa', x.approval ? `${u.name} quiere ir a tu chispa "${x.title}". Decide tú.` : `${u.name} se apunta a tu chispa "${x.title}".`, { route:'chispa/' + id });
    saveState(); if (!x.approval) checkIdeaReady(x);
    if (location.hash === '#/chispa/' + id && ideaState(x) === 'abierta') renderIdea(id);
  }, 3000 + i * 3000));
}

/* ---------- de chispa a plan ---------- */
// Tras cada "sí": si se llega al mínimo, se avisa a quien la lanzó (o se hace solo, si lo pidió).
function checkIdeaReady(x){
  if (!x || ideaState(x) !== 'abierta') return;
  const n = ideaYes(x).length + 1;
  if (n < (x.min || 1)) return;
  if (x.authorId === 'me'){
    if (x.auto) return confirmIdeaPlan(x.id, { auto:true });
    if (!x.readyNotified){ x.readyNotified = true; saveState(); notify('chispa', `Ya sois ${n} en "${x.title}": ¿lo hacemos? Confirma el plan.`, { route:'chispa/' + x.id }); }
  } else if (myIdeaStatus(x) === 'si' && !x.simConfirm){ x.simConfirm = true; saveState(); setTimeout(() => simulateAuthorConfirms(x.id), 5000); }   // demo
}
// Fecha propuesta cuando la chispa no la tenía (quien la lanza la puede cambiar).
function suggestedWhen(x){
  if (x.when === 'fecha' && x.date) return new Date(x.date);
  const d = new Date(); d.setSeconds(0, 0);
  if (x.when === 'hoy'){ d.setHours(Math.min(d.getHours() + 3, 22), 0); return d; }
  if (x.when === 'finde'){ d.setDate(d.getDate() + ((6 - d.getDay() + 7) % 7 || 7)); d.setHours(11, 0); return d; }
  d.setDate(d.getDate() + (x.when === 'semana' ? 2 : 4)); d.setHours(19, 0); return d;
}

function pilotHypotheses(){

    { id:'H1', name:'Hay demanda de planes con desconocidos', value:`${s.registros} registros · ${s.activacion} % activación`, target:'≥ 300 y ≥ 40 %', status:h1 },
    { id:'H2', name:'Quien se apunta, aparece', value:`Gratis ${s.asistenciaGratis} % · pago ${s.asistenciaPago} %`, target:'Gratis ≥ 60 %; pago ≥ 85 %',

    { id:'H3', name:'La experiencia engancha', value:`${s.repeticion} % repite en 30 días`, target:'≥ 30 %', status: band(s.repeticion, 30, 15) },
    { id:'H4', name:'Existe disposición a pagar', value:`${s.aforoPago} % del aforo vendido`, target:'≥ 70 %', status: band(s.aforoPago, 70, 40) },
    { id:'H5', name:'El contenido se genera solo', value:`${s.planesConFotos} % de planes con fotos`, target:'≥ 50 %', status: band(s.planesConFotos, 50, 25) },
    { id:'H6', name:'La experiencia es segura y buena', value:`${String(s.valoracion).replace('.', ',')}/5 · ${s.incidentesGraves} incidentes graves`, target:'≥ 4,3/5 y 0 graves',
      status: s.incidentesGraves > 0 ? 'rojo' : band(s.valoracion, 4.3, 4.0) },
  ];

// Datos vivos de esta demo (lo que hay en el navegador).

// Columnas de la métrica principal: asistencias verificadas por semana (una serie: sin leyenda).
function weeklyChart(){
  const W = 320, H = 150, pad = { l: 30, r: 8, t: 16, b: 24 }, bw = 24;
  const max = Math.max(...PILOT_WEEKS.map(w => w.asistencias)), top = Math.ceil(max / 25) * 25;
  const band = (W - pad.l - pad.r) / PILOT_WEEKS.length, y = (v) => pad.t + (H - pad.t - pad.b) * (1 - v / top);
  const ticks = [0, top / 2, top];
  const bars = PILOT_WEEKS.map((w, i) => {
    const x = pad.l + band * i + (band - bw) / 2, y0 = y(0), y1 = y(w.asistencias), r = 4, last = i === PILOT_WEEKS.length - 1;
    // Extremo de datos redondeado (4 px) y recto en la línea base.
    const d = `M${x},${y0} V${y1 + r} Q${x},${y1} ${x + r},${y1} H${x + bw - r} Q${x + bw},${y1} ${x + bw},${y1 + r} V${y0} Z`;
    return `<g class="wk-bar"><title>${w.w}: ${w.asistencias} asistencias verificadas de ${w.apuntados} apuntados</title>
      <rect x="${pad.l + band * i}" y="${pad.t}" width="${band}" height="${H - pad.t - pad.b}" fill="transparent"/>
      <path d="${d}" class="wk-col"/>${last ? `<text x="${x + bw / 2}" y="${y1 - 5}" text-anchor="middle" class="wk-val">${w.asistencias}</text>` : ''}
      <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" class="wk-axis">S${i + 1}</text></g>`;
  }).join('');
  const grid = ticks.map(t => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(t)}" y2="${y(t)}" class="wk-grid"/><text x="${pad.l - 6}" y="${y(t) + 3}" text-anchor="end" class="wk-axis">${t}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="wk-chart" role="img" aria-label="Asistencias verificadas por semana: ${PILOT_WEEKS.map(w => w.asistencias).join(', ')}">${grid}${bars}</svg>`;
}
